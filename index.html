/* ---------- qué hay pendiente de subir ---------- */
function metaDocs(){
  var out=[];
  /* clock_snap se envía con el resto pero no cuenta para saber si hay cambios: así dos dispositivos no se pasan el partido de un lado a otro */
  function mk(key,d){var x=Object.assign({},d);delete x.clock_snap;out.push({key:key,data:d,h:hash(JSON.stringify(x))});}
  var st=Object.assign({},S.settings);delete st.map;delete st.advStats;delete st.advReport;   /* estos interruptores son de cada dispositivo */
  mk('team',{name:S.team.name,settings:st});
  S.players.forEach(function(p){mk('p:'+p.id,{cid:p.id,num:p.num,name:p.name,deleted:false});});
  S.games.forEach(function(g){
    var last=g.events.length?g.events[g.events.length-1]:null;
    mk('g:'+g.id,{cid:g.id,opp:g.opp,game_date:g.date,comp:g.comp,status:g.status,period_len:g.periodLen,ot_len:g.otLen,period:g.period,
      clock_snap:(last&&last.p===g.period)?last.c:lenOf(g,g.period),start_ids:g.start,roster_ids:g.roster||g.start,opp_players:g.oppPlayers,opp_defense:g.oppDefense,our_defense:g.ourDefense||'Individual',deleted:false});
  });
  return out;
}
function pendingEvents(){
  var out=[];
  S.games.forEach(function(g){g.events.forEach(function(e){if(evU(e)>(S.sync.eu[e.id]||0))out.push({g:g,e:e});});});
  return out;
}
function recount(){
  if(!DBX){SYNC.pending=0;paintSync();return;}
  var n=pendingEvents().length,seen={};
  metaDocs().forEach(function(d){seen[d.key]=1;if(S.sync.h[d.key]!==d.h)n++;});
  Object.keys(S.sync.h).forEach(function(k){if(!seen[k])n++;});
  SYNC.pending=n;paintSync();
}
function schedFlush(){
  if(SYNC.t)return;
  var wait=SYNC.err?60000:20000;
  if(SYNC.backoff&&SYNC.backoff>Date.now())wait=Math.max(wait,SYNC.backoff-Date.now()+1000);
  SYNC.t=setTimeout(function(){SYNC.t=null;flush();},wait);
}

/* ---------- traducción acción <-> registro ---------- */
function evToRow(e,gid){
  return {cid:e.id,game_id:gid,period:e.p,clock:e.c,side:e.side,player_key:e.k==null?'':String(e.k),etype:e.t,made:!!e.m,points:e.pts||0,
    x:e.x==null?0:e.x,y:e.y==null?0:e.y,zone:e.z||'',play:e.play||'',defense:e.def||'',rel_id:e.rel||'',rec_id:e.rec==null?'':String(e.rec),grp:e.grp||'',voided:!!e.v,ts:e.ts||0,o:evO(e),u:evU(e)};
}
function rowToEv(r){
  var e={id:r.cid,p:r.period,c:r.clock,v:!!r.voided,ts:r.ts,o:r.o||r.ts*1000,u:r.u,side:r.side,t:r.etype};
  if(r.player_key)e.k=r.player_key;
  if(e.t==='s2'||e.t==='s3'||e.t==='ft')e.m=!!r.made;
  if(r.points)e.pts=r.points;
  if(r.zone){e.x=r.x;e.y=r.y;e.z=r.zone;}
  if(r.play)e.play=r.play;if(r.defense)e.def=r.defense;if(r.rel_id)e.rel=r.rel_id;if(r.rec_id)e.rec=r.rec_id;if(r.grp)e.grp=r.grp;
  return e;
}
async function upsertRec(coll,id,data,exists){
  var c=PB.collection(coll);
  if(exists){
    try{return await c.update(id,data);}
    catch(e){if(e&&e.status===404)return await c.create(Object.assign({id:id},data));throw e;}
  }
  try{return await c.create(Object.assign({id:id},data));}
  catch(e){if(e&&e.status===400)return await c.update(id,data);throw e;}
}
async function pool(items,n,fn){
  var i=0,err=null;
  async function w(){while(i<items.length&&!err){var it=items[i++];try{await fn(it);}catch(e){err=e;}}}
  var ws=[];for(var k=0;k<n;k++)ws.push(w());
  await Promise.all(ws);
  if(err)throw err;
}

/* ---------- equipo, subida y bajada ----------
   La nube gratuita limita las peticiones por hora, así que:

function buildOps(){
  var T=S.sync.team,now=Date.now(),ops=[],dels=[],docs=metaDocs(),seen={};
  docs.forEach(function(d){
    seen[d.key]=1;
    if(S.sync.h[d.key]===d.h)return;
    if(d.key==='team'){
      ops.push({c:'teams',id:T,kind:'update',data:{name:d.data.name,settings:d.data.settings,u:now},done:function(){S.sync.tu=now;S.sync.h.team=d.h;}});
    }else{
      var coll=d.key.charAt(0)==='p'?'players':'games',cid=d.key.slice(2);
      ops.push({c:coll,id:rid(T+'|'+coll+'|'+cid),kind:'upsert',ex:!!S.sync.mu[d.key],data:Object.assign({team:T,u:now},d.data),done:function(){S.sync.mu[d.key]=now;S.sync.h[d.key]=d.h;}});
    }
  });
  Object.keys(S.sync.h).forEach(function(k){
    if(seen[k]||k==='team')return;
    var coll=k.charAt(0)==='p'?'players':'games';
    dels.push({c:coll,id:rid(T+'|'+coll+'|'+k.slice(2)),kind:'delete',data:{deleted:true,u:now},done:function(){delete S.sync.h[k];delete S.sync.mu[k];}});
  });
  pendingEvents().forEach(function(it){
    ops.push({c:'events',id:rid(T+'|events|'+it.e.id),kind:'upsert',ex:!!S.sync.eu[it.e.id],data:Object.assign({team:T},evToRow(it.e,it.g.id)),done:function(){S.sync.eu[it.e.id]=evU(it.e);}});
  });
  return {ops:ops,dels:dels};
}
async function upsertRec(coll,id,data,exists){
  var c=PB.collection(coll);
  if(exists){
    try{return await c.update(id,data);}
    catch(e){if(e&&e.status===404)return await c.create(Object.assign({id:id},data));throw e;}
  }
  try{return await c.create(Object.assign({id:id},data));}
  catch(e){if(e&&e.status===400)return await c.update(id,data);throw e;}
}
async function sendOne(o){
  if(o.kind==='update')return PB.collection(o.c).update(o.id,o.data);
  if(o.kind==='delete'){try{return await PB.collection(o.c).update(o.id,o.data);}catch(e){if(e&&e.status===404)return;throw e;}}
  return upsertRec(o.c,o.id,o.data,o.ex);
}
async function pool(items,n,fn){
  var i=0,err=null;
  async function w(){while(i<items.length&&!err){var it=items[i++];try{await fn(it);}catch(e){err=e;}}}
  var ws=[];for(var k=0;k<n;k++)ws.push(w());
  await Promise.all(ws);
  if(err)throw err;
}
async function sendChunk(chunk){
  if(!S.sync.nobatch&&chunk.length>1){
    try{
      var b=PB.createBatch();
      chunk.forEach(function(o){
        var col=b.collection(o.c);
        if(o.kind==='upsert')col.upsert(Object.assign({id:o.id},o.data));else col.update(o.id,o.data);
      });
      var res=await b.send();
      if(res.some(function(r){return r.status>=300;}))throw {status:400};
      chunk.forEach(function(o){o.done();});
      return;
    }catch(e){
      if(e&&e.status===403)S.sync.nobatch=true;           // el servidor no admite lotes: camino lento
      else if(!e||e.status!==400)throw e;                  // 400: algún registro falla, se reintenta uno a uno
    }
  }
  await pool(chunk,4,async function(o){await sendOne(o);o.done();});
}
async function pushAll(){
  if(!S.sync.team)return;
  var b=buildOps(),all=b.ops,i;
  SYNC.pending=all.length+b.dels.length;
  for(i=0;i<all.length;i+=BATCH){
    var chunk=all.slice(i,i+BATCH);
    await sendChunk(chunk);
    SYNC.pending-=chunk.length;paintSync();
  }
  for(i=0;i<b.dels.length;i++){await sendOne(b.dels[i]);b.dels[i].done();SYNC.pending--;}
}

/* aplicar lo que llega de la nube (por descarga o por tiempo real) */
function applyPlayer(r){
  var key='p:'+r.cid,lp=S.players.find(function(p){return p.id===r.cid;});
  if(r.deleted){if(lp){S.players=S.players.filter(function(p){return p.id!==r.cid;});delete S.sync.h[key];delete S.sync.mu[key];return true;}return false;}
  if(lp&&(r.u||0)<=(S.sync.mu[key]||0))return false;
  if(!lp)S.players.push({id:r.cid,num:r.num,name:r.name});else{lp.num=r.num;lp.name=r.name;}
  S.sync.mu[key]=r.u||0;
  var pd=metaDocs().filter(function(d){return d.key===key;})[0];if(pd)S.sync.h[key]=pd.h;
  return true;
}
function applyGame(r){
  var key='g:'+r.cid,g=S.games.find(function(x){return x.id===r.cid;});
  if(r.deleted){
    if(g){S.games=S.games.filter(function(x){return x.id!==r.cid;});if(S.currentId===r.cid){stopClock();S.currentId=S.games.length?S.games[S.games.length-1].id:null;}delete S.sync.h[key];delete S.sync.mu[key];return true;}
    return false;
  }
  if(g&&(r.u||0)<=(S.sync.mu[key]||0))return false;
  if(!g){g={id:r.cid,events:[],running:false};S.games.push(g);}
  g.opp=r.opp;g.date=r.game_date;g.comp=r.comp;g.status=r.status;g.periodLen=r.period_len;g.otLen=r.ot_len;g.period=r.period;
  if(!g.running)g.clock=r.clock_snap;
  g.start=r.start_ids||[];g.roster=(r.roster_ids&&r.roster_ids.length)?r.roster_ids:g.start.slice();g.oppPlayers=r.opp_players||[];g.oppDefense=r.opp_defense;g.ourDefense=r.our_defense||'Individual';
  S.sync.mu[key]=r.u||0;
  var md=metaDocs().filter(function(d){return d.key===key;})[0];if(md)S.sync.h[key]=md.h;
  return true;
}
function resortGame(g){
  g.events=g.events.map(function(e,i){return {e:e,i:i};}).sort(function(a,b){return evO(a.e)-evO(b.e)||a.i-b.i;}).map(function(x){return x.e;});
  if(!g.running){var last=g.events.length?g.events[g.events.length-1]:null;if(last&&last.p===g.period)g.clock=last.c;}
}
function applyEvent(r,idx,touched){
  var g=S.games.find(function(x){return x.id===r.game_id;});
  if(!g)return false;
  var m=idx[g.id];
  if(!m){m=idx[g.id]={};g.events.forEach(function(e,i){m[e.id]=i;});}
  var ev=rowToEv(r),changed=false;
  if(m[ev.id]==null){g.events.push(ev);m[ev.id]=g.events.length-1;touched[g.id]=1;changed=true;}
  else if((r.u||0)>evU(g.events[m[ev.id]])){g.events[m[ev.id]]=ev;changed=true;}
  S.sync.eu[ev.id]=Math.max(S.sync.eu[ev.id]||0,r.u||0);
  return changed;
}
function pbDate(ms){return new Date(ms).toISOString().replace('T',' ');}
function pbMs(s){return Date.parse(String(s).replace(' ','T'));}
async function pullColl(coll,apply){
  var T=S.sync.team,since=S.sync.cur[coll]?S.sync.cur[coll]-120000:0;
  var f='team="'+T+'" && updated >= "'+pbDate(since)+'"',page=1,newest=S.sync.cur[coll]||0,changed=false;
  for(;;){
    var r=await PB.collection(coll).getList(page,500,{filter:f,sort:'updated',skipTotal:true});
    r.items.forEach(function(it){var m=pbMs(it.updated);if(m>newest)newest=m;if(apply(it))changed=true;});
    if(r.items.length<500)break;
    page++;
  }
  S.sync.cur[coll]=newest;
  return changed;
}
async function pullAll(){
  if(!S.sync.team)return;
  var T=S.sync.team,changed=false;
  var tr=await PB.collection('teams').getOne(T);
  if((tr.u||0)>(S.sync.tu||0)){
    if(tr.name&&tr.name!==S.team.name){S.team.name=tr.name;changed=true;}
    if(tr.settings&&typeof tr.settings==='object'){var mp=S.settings.map;S.settings=Object.assign({},S.settings,tr.settings);S.settings.map=mp;changed=true;}
    S.sync.tu=tr.u;
    var td=metaDocs().filter(function(d){return d.key==='team';})[0];if(td)S.sync.h.team=td.h;
  }
  if(await pullColl('players',applyPlayer))changed=true;
  if(await pullColl('games',applyGame))changed=true;
  var idx={},touched={};
  if(await pullColl('events',function(r){return applyEvent(r,idx,touched);}))changed=true;
  Object.keys(touched).forEach(function(id){resortGame(S.games.find(function(x){return x.id===id;}));});
  if(!cur()&&S.games.length){var lv=S.games.filter(function(x){return x.status==='live';});S.currentId=(lv.length?lv[lv.length-1]:S.games[S.games.length-1]).id;changed=true;}
  if(changed)SYNC.changed=true;
  SYNC.lastPull=Date.now();
}
function errCode(e){return e&&(e.status!=null?String(e.status):(e.code||e.message))||'error';}
async function flush(full){
  if(!DBX||SYNC.busy)return;
  if(navigator.onLine===false){paintSync();return;}
  if(SYNC.backoff&&Date.now()<SYNC.backoff){paintSync();return;}
  SYNC.busy=true;SYNC.err=null;paintSync();
  try{
    await ensureTeam();
    await pushAll();
    if(full||!SYNC.lastPull)await pullAll();
    SYNC.last=Date.now();
  }catch(e){
    SYNC.err=errCode(e);
    if(e&&e.status===429){SYNC.backoff=Date.now()+10*60000;}
    if(e&&e.status===401){PB.authStore.clear();setToast('La sesión ha caducado. Vuelve a entrar en Equipo.');}
  }
  SYNC.busy=false;
  saveNow();
  finishSync();
}
function finishSync(){
  if(SYNC.changed){
    SYNC.changed=false;
    clearTimeout(SYNC.rr);
    SYNC.rr=setTimeout(function(){if(!U.sheet&&U.tab!=='team')render();},250);
  }
}

/* ---------- tiempo real: lo que anota otro dispositivo llega solo, sin gastar peticiones ---------- */
function onRT(coll){
  return function(ev){
    try{
      var r=ev&&ev.record;if(!r||ev.action==='delete'||r.team!==S.sync.team)return;
      var ch=false;
      if(coll==='events'){var idx={},t={};ch=applyEvent(r,idx,t);Object.keys(t).forEach(function(id){resortGame(S.games.find(function(x){return x.id===id;}));});}
      else if(coll==='games')ch=applyGame(r);
      else ch=applyPlayer(r);
      if(ch){SYNC.changed=true;saveNow();finishSync();}
    }catch(e){}
  };
}
function startRealtime(){
  if(_rt||!PB||!S.sync.team)return;
  _rt=true;
  ['events','games','players'].forEach(function(c){
    try{PB.collection(c).subscribe('*',onRT(c),{filter:'team="'+S.sync.team+'"'}).catch(function(){_rt=false;});}catch(e){_rt=false;}
  });
}
function stopRealtime(){try{if(PB)PB.realtime.unsubscribe();}catch(e){}_rt=false;}

function authMsg(e,signup){
  if(!e)return 'Error desconocido';
  if(e.status===0)return 'Sin conexión con el servidor. Comprueba internet.';
  var d=e.response&&e.response.data||{};
  if(d.email&&d.email.code==='validation_not_unique')return 'Ese correo ya tiene una cuenta. Pulsa Entrar.';
  if(d.email)return 'Escribe un correo válido.';
  if(d.password)return 'La contraseña necesita al menos 8 caracteres.';
  if(e.status===400&&!signup)return 'Correo o contraseña incorrectos.';

}

var DEMO=[['4','Álvaro Ruiz'],['5','Marc Vidal'],['7','Hugo Serra'],['8','Dani Ortega'],['9','Pau Costa'],['10','Iker Gómez'],['11','Sergio Mora'],['12','Lucas Prieto'],['13','Adrián Nieto'],['14','Javi León'],['15','Nico Ferrer'],['21','Raúl Cano']];
function samplePos(t,rnd){
  var x,y,a,r;
  if(t==='s3'){
    if(rnd()<0.22){var left=rnd()<0.5;x=left?18+rnd()*16:566+rnd()*16;y=15+rnd()*100;}
    else{a=(rnd()*2-1)*68*Math.PI/180;r=274+rnd()*24;x=300+Math.sin(a)*r;y=63+Math.cos(a)*r;}
  }else{
    r=rnd();
    if(r<0.45){x=300+(rnd()*2-1)*45;y=63+rnd()*42;}
    else if(r<0.65){x=215+rnd()*170;y=110+rnd()*115;}
    else{a=(rnd()*2-1)*78*Math.PI/180;r=100+rnd()*130;x=300+Math.sin(a)*r;y=63+Math.cos(a)*r;}
  }
  return {x:Math.max(4,Math.min(596,x)),y:Math.max(4,Math.min(556,y))};
}
function makeDemoGame(){
  if(S.players.length<5)ACT.demoRoster();
  var seed=11;
  function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  function pick(a){return a[Math.floor(rnd()*a.length)];}
  var ids=S.players.slice().sort(byNum).map(function(p){return p.id;}).slice(0,12);
  var g=newGameObj('CB Ejemplo',today(),'Liga regular',ids.slice(0,5));
  g.oppPlayers=['4','5','7','9','10','11','13','15'];
  var W=['7','7','7','10','10','10','5','5','4','4','9','9','11','13','15'];
  var on=ids.slice(0,5),bench=ids.slice(5),fl={},ofl={};
  var defs=['Individual','Zona 2-3','Individual','Zona 2-3'];
  var q,i,c;
  function ev(o){var e=Object.assign({id:uid(),p:q,c:Math.ceil(c),v:false,ts:Date.now(),o:nextO()},o);g.events.push(e);return e;}
  function shot(side,k,extra){
    var t=rnd()<0.34?'s3':'s2',m=rnd()<(t==='s3'?0.34:0.52),pos=samplePos(t,rnd);
    var e=ev(Object.assign({side:side,k:k,t:t,m:m,pts:m?(t==='s3'?3:2):0,x:Math.round(pos.x),y:Math.round(pos.y),z:zoneOf(pos.x,pos.y)},extra||{}));
    return e;
  }
  for(q=1;q<=4;q++){
    g.oppDefense=defs[q-1];
    for(i=0;i<44;i++){
      c=Math.max(0,600-Math.floor(i*13.6));
      if(i===16||i===32){
        var outs=[on[i%5],on[(i+2)%5]],ins=[bench.shift(),bench.shift()],grp=uid();
        outs.forEach(function(id){ev({side:'us',k:id,t:'out',grp:grp});});
        ins.forEach(function(id){ev({side:'us',k:id,t:'in',grp:grp});});
        on=on.filter(function(id){return outs.indexOf(id)<0;}).concat(ins);bench=bench.concat(outs);
      }
      if(q===2&&i===20)ev({side:'us',k:null,t:'to'});
      if(q===4&&i===30)ev({side:'opp',k:null,t:'to'});
      var r=rnd();
      if(i%2===0){
        var sh=pick(on);
        if(r<0.13){ev({side:'us',k:sh,t:'tov',def:g.oppDefense});if(rnd()<0.4)ev({side:'opp',k:pick(W),t:'stl'});}
        else if(r<0.21){
          var fk=pick(W);if((ofl[fk]||0)<4){ofl[fk]=(ofl[fk]||0)+1;ev({side:'opp',k:fk,t:'pf'});}
          for(var f=0;f<2;f++){var mm=rnd()<0.72;ev({side:'us',k:sh,t:'ft',m:mm,pts:mm?1:0});}
        }else{
          var e=shot('us',sh,{def:g.oppDefense});
          if(e.m){if(rnd()<0.55)ev({side:'us',k:pick(on.filter(function(id){return id!==sh;})),t:'ast',rel:e.id});}
          else if(rnd()<0.27)ev({side:'us',k:pick(on),t:'oreb'});
          else ev({side:'opp',k:pick(W),t:'dreb'});
        }
        if(rnd()<0.09){var pk=pick(on);if((fl[pk]||0)<4){fl[pk]=(fl[pk]||0)+1;ev({side:'us',k:pk,t:'pf'});}}
      }else{
        var ok=pick(W),play=pick(PLAYS);
        if(r<0.14){ev({side:'opp',k:ok,t:'tov',play:play});if(rnd()<0.4)ev({side:'us',k:pick(on),t:'stl'});}
        else if(r<0.21){
          var pk2=pick(on);if((fl[pk2]||0)<4){fl[pk2]=(fl[pk2]||0)+1;ev({side:'us',k:pk2,t:'pf'});}
          for(var f2=0;f2<2;f2++){var m2=rnd()<0.66;ev({side:'opp',k:ok,t:'ft',m:m2,pts:m2?1:0});}
        }else{
          var e2=shot('opp',ok,{play:play});
          if(e2.m){if(rnd()<0.5)ev({side:'opp',k:pick(W),t:'ast',rel:e2.id});}
          else if(rnd()<0.3)ev({side:'opp',k:pick(W),t:'oreb'});
          else ev({side:'us',k:pick(on),t:'dreb'});
        }
        if(rnd()<0.09){var fk2=pick(W);if((ofl[fk2]||0)<4){ofl[fk2]=(ofl[fk2]||0)+1;ev({side:'opp',k:fk2,t:'pf'});}}
      }
    }
  }
  g.period=4;g.clock=0;g.status='done';
  S.games.push(g);S.currentId=g.id;U.top=true;U.tab='report';U.scope='one';save();render();
}
