:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E7EBF0; --surface:#FFFFFF; --surface-2:#F1F4F8; --ink:#0E1A2B; --muted:#586579; --line:#D0D8E2;
  --court:#1A5DA8; --court-deep:#123F73; --on-court:#FFFFFF; --court-fg:#1A5DA8; --court-soft:#DCE8F6;
  --made:#0F7A50; --made-bg:#D9F1E5; --miss:#B4332A; --miss-bg:#FADFDB; --foul:#8A5708; --foul-bg:#FAEAC8;
  --opp:#C2570A; --opp-fg:#B4500A; --opp-bg:#FBE4D0;
  --ct-floor:#EEF2F7; --ct-paint:#CFE0F3; --ct-line:#7F95AF;
  --shadow:0 -6px 24px rgba(14,26,43,.12);
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-body:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1520; --surface:#162131; --surface-2:#1C2A3D; --ink:#E8EEF6; --muted:#9AA8BC; --line:#2A3A50;
    --court:#2C6FBC; --court-deep:#0F3560; --court-fg:#7DB4F2; --court-soft:#1B3350;
    --made:#5BD09B; --made-bg:#12402E; --miss:#F28B80; --miss-bg:#472220; --foul:#EDB95A; --foul-bg:#43351A;
    --opp:#B8530A; --opp-fg:#F2A163; --opp-bg:#402A16;
    --ct-floor:#182435; --ct-paint:#1F3B5E; --ct-line:#5A7597;
    --shadow:0 -6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#162131; --surface-2:#1C2A3D; --ink:#E8EEF6; --muted:#9AA8BC; --line:#2A3A50;
  --court:#2C6FBC; --court-deep:#0F3560; --court-fg:#7DB4F2; --court-soft:#1B3350;
  --made:#5BD09B; --made-bg:#12402E; --miss:#F28B80; --miss-bg:#472220; --foul:#EDB95A; --foul-bg:#43351A;
  --opp:#B8530A; --opp-fg:#F2A163; --opp-bg:#402A16;
  --ct-floor:#182435; --ct-paint:#1F3B5E; --ct-line:#5A7597;
  --shadow:0 -6px 24px rgba(0,0,0,.5);
}

*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font-body);-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
:focus-visible{outline:3px solid var(--court-fg);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 150px}
.mut{color:var(--muted)}
.tt{font:800 34px/1.05 var(--font-display);letter-spacing:.01em;padding:18px 0 12px}
h2{font:700 15px/1.2 var(--font-body)}

/* ---------- marcador ---------- */
.sb{position:relative;margin:0 -14px;padding:14px 14px 10px;background:var(--court);color:var(--on-court);overflow:hidden}
.sb-lines{position:absolute;inset:0;width:100%;height:100%;stroke:#fff;stroke-opacity:.16;stroke-width:2.5;fill:none;pointer-events:none}
.sb-grid{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.sb-team{display:flex;flex-direction:column;align-items:center;min-width:0}
.sb-name{font-weight:600;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:3px;border-bottom:4px solid rgba(255,255,255,.55)}
.sb-team.opp .sb-name{border-bottom-color:#FF9B4A}
.sb-score{font:900 76px/.95 var(--font-display);letter-spacing:.01em;padding-top:4px}
.sb-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.sb-per{font:700 13px/1 var(--font-body);padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.18)}
.sb-time{font:800 46px/1 var(--font-display);letter-spacing:.02em;color:#fff}
.sb-play{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--court-deep);display:grid;place-items:center}
.sb-play svg{width:22px;height:22px}
.sb-meta{position:relative;display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12.5px}
.sb-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fd{display:inline-flex;gap:3px}
.fd i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28)}
.fd i.on{background:#FFC857}
.sb-m em{font-style:normal;font-weight:700;background:#FFC857;color:#3A2600;border-radius:5px;padding:1px 6px}

.note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--foul-bg);color:var(--foul);font-size:14px}
.lk{font-weight:700;text-decoration:underline;color:inherit}

/* ---------- selector de bando ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.seg button{padding:12px 6px 10px;font-weight:600;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.on{color:var(--ink);font-weight:800}
.seg button.on.us{border-bottom-color:var(--court)}
.seg button.on.opp{border-bottom-color:var(--opp)}

.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.ph-r{display:flex;gap:8px;align-items:center}
.cnt{font-weight:600;color:var(--muted);margin-left:4px}
.cnt.warn{color:var(--miss)}
.tg{padding:7px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:var(--surface)}
.tg.on{border-color:var(--court);color:var(--court-fg);background:var(--court-soft)}
.tg .sw{display:inline-block;position:relative;width:30px;height:18px;border-radius:9px;background:var(--line);margin-left:8px;vertical-align:-4px}
.tg .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on .sw{background:var(--court)}
.tg.on .sw::after{left:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface);border:1.5px solid var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.pri{background:var(--court);border-color:var(--court);color:var(--on-court)}
.btn.danger{background:var(--miss);border-color:var(--miss);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px}

/* ---------- jugadores ---------- */
.pls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pls.wide{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.pl{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px;padding:8px 2px 7px;border-radius:14px;background:var(--surface);border:2px solid var(--line);min-width:0}
.pl b{font:800 36px/1 var(--font-display)}
.pl .nm{font-size:11.5px;max-width:100%;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pl .pt{font-size:11.5px;color:var(--muted);font-weight:600}
.pl .fd i{width:6px;height:6px;background:var(--line)}
.pl .fd i.on{background:var(--foul)}
.pl.sel{background:var(--court);border-color:var(--court);color:var(--on-court)}
.pl.opp.sel{background:var(--opp);border-color:var(--opp)}
.pl.sel .nm,.pl.sel .pt{color:inherit;opacity:.9}
.pl.sel .fd i{background:rgba(255,255,255,.35)}
.pl.sel .fd i.on{background:#FFC857}
.pl.warn{border-color:var(--foul)}
.pl.out{border-color:var(--miss)}
.pl.add{border-style:dashed;color:var(--muted);font-weight:700;font-size:14px}

.hint{margin:12px 0 0;font-size:14px;color:var(--muted);min-height:20px}
.hint b{color:var(--ink)}
.hint.sm{font-size:12.5px;margin-top:8px;min-height:0}
.acts{display:grid;gap:8px;margin-top:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ab{min-height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;background:var(--surface);border:2px solid var(--line);font-weight:600;min-width:0}
.ab b{font:800 26px/1 var(--font-display)}
.ab small{font-size:11px;font-weight:500;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab.made{background:var(--made-bg);border-color:transparent;color:var(--made)}
.ab.miss{background:var(--miss-bg);border-color:transparent;color:var(--miss)}
.ab.foul{background:var(--foul-bg);border-color:transparent;color:var(--foul)}
.ab.made small,.ab.miss small,.ab.foul small{color:inherit;opacity:.85}
.ab.dim{opacity:.42}
.ab:active{transform:scale(.97)}

.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-top:6px;-webkit-overflow-scrolling:touch}
.chiprow .lbl{flex:none;align-self:center;font-size:13px;color:var(--muted);font-weight:600}
.chip{flex:none;padding:8px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.assist{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--made-bg);color:var(--made);overflow-x:auto}
.assist>span{flex:none;font-weight:700;font-size:14px}
.assist button{flex:none;padding:8px 13px;border-radius:10px;background:var(--surface);color:var(--ink);font-weight:700;border:1.5px solid var(--made)}
.assist button.no{border-color:transparent;background:transparent;color:inherit;font-weight:600;text-decoration:underline}

/* ---------- registro ---------- */
.blk{margin-top:22px}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.log{border-top:1px solid var(--line)}
.lg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0 9px 10px;border-bottom:1px solid var(--line);border-left:4px solid var(--court);font-size:14px}
.lg.opp{border-left-color:var(--opp)}
.lg.void .lx{text-decoration:line-through;color:var(--muted)}
.lt{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.lb{font-size:13px;font-weight:700;color:var(--court-fg);padding:6px 8px}
.empty{padding:14px 0;color:var(--muted);font-size:14px}

/* ---------- barra inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow)}
.nv{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nv svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nv.on{color:var(--court-fg);background:var(--court-soft)}
.undo{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100% - 28px)}
.undo svg{width:18px;height:18px;flex:none}
.undo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* ---------- hojas ---------- */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(8,16,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px 0}
.sheet h3{font:800 26px/1.1 var(--font-display);margin-bottom:12px}
.sheet .sub{color:var(--muted);font-size:14px;margin:-6px 0 12px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.in{width:100%;min-height:46px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-size:16px}
.in.num{width:64px;text-align:center;font-weight:700}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;accent-color:var(--court)}
.chk b{font:800 22px/1 var(--font-display);min-width:30px}
.btns{display:flex;gap:10px;margin-top:14px}
.btns .btn{flex:1}
.subrow{display:grid;grid-template-columns:34px 1fr 26px;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 6px;border-bottom:1px solid var(--line);text-align:left}
.subrow b{font:800 24px/1 var(--font-display)}
.subrow small{color:var(--muted);font-size:12px}
.subrow .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line)}
.subrow.on .ck{background:var(--court);border-color:var(--court);box-shadow:inset 0 0 0 4px var(--surface)}
.subrow.on{background:var(--court-soft)}
.subrow[disabled]{opacity:.4}
.grid-p{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.grid-p button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
.grid-p button.on{background:var(--court);color:var(--on-court);border-color:var(--court)}
.adj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.adj button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);font-weight:700}
textarea.in{padding:10px 12px;min-height:220px;line-height:1.45;resize:vertical}

/* ---------- lista de partidos ---------- */
.gm{padding:14px 0;border-bottom:1px solid var(--line)}
.gm.cur{border-left:4px solid var(--court);padding-left:12px}
.gm-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gm-top b{font-size:17px}
.gm-top .mut{display:block;font-size:13px}
.gm-sc{font:800 32px/1 var(--font-display);white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--court-soft);color:var(--court-fg)}
.pill.done{background:var(--surface-2);color:var(--muted)}
.gm-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- equipo ---------- */
.prow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ib{width:44px;height:44px;flex:none;border-radius:10px;font-size:22px;color:var(--muted);border:1.5px solid var(--line)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.setg{margin-top:26px}
.setg h2{margin-bottom:8px;font-size:17px}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.t{border-collapse:collapse;width:100%;font-size:13.5px}
.t th,.t td{padding:9px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.t th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface-2)}
.t th:first-child,.t td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--surface)}
.t th:first-child{background:var(--surface-2)}
.t tbody tr:last-child td{border-bottom:0}
.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.t td b{font-weight:800}
.pos{color:var(--made);font-weight:700}
.neg{color:var(--miss);font-weight:700}
.t .best{font-weight:800;color:var(--court-fg)}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 4px}
.res .sc{font:800 40px/1 var(--font-display)}
details{margin-top:22px}
summary{cursor:pointer;font-weight:700;padding:8px 0}

/* ---------- informe ---------- */
.rep-bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.rep h1{font:800 38px/1.02 var(--font-display);padding-top:16px}
.rep .meta{color:var(--muted);font-size:14px;margin:6px 0 4px}
.rep section{margin-top:26px}
.rep h2{font:800 24px/1.1 var(--font-display);margin-bottom:10px;letter-spacing:.01em}
.keys li{padding:9px 0 9px 14px;border-left:4px solid var(--court);margin-bottom:8px;background:var(--surface);border-radius:0 10px 10px 0;font-size:15px}
.keys li.w{border-left-color:var(--opp)}
.ai{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--court);white-space:pre-wrap;font-size:15px;line-height:1.5}
.ai h3{font:800 18px/1 var(--font-display);margin-bottom:6px;white-space:normal}
.bar{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--surface-2);vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--court)}
.bar.o i{background:var(--opp)}
.two{display:grid;gap:14px}
.court{width:100%;height:auto;aspect-ratio:600/560;display:block;border-radius:12px;touch-action:manipulation}
.ct-floor{fill:var(--ct-floor)}
.ct-paint{fill:var(--ct-paint)}
.ct-lines{stroke:var(--ct-line);fill:none;stroke-width:3}
.ct-lines .d{stroke-dasharray:9 9}
.sm-m{fill:var(--made);stroke:var(--surface);stroke-width:2;opacity:.92}
.sm-x{stroke:var(--miss);stroke-width:4.5;stroke-linecap:round;fill:none}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:8px 0 0;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--made);margin-right:5px;vertical-align:-1px}
.legend u{text-decoration:none;color:var(--miss);font-weight:800;margin-right:5px}
.flow{width:100%;height:auto;display:block}
.fl-us{fill:var(--court);opacity:.4}
.fl-opp{fill:var(--opp);opacity:.4}
.fl-line{stroke:var(--ink);stroke-width:2.2}
.fl-ax{stroke:var(--line);stroke-width:1.5}
.fl-sep{stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}
.flow text{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.hot{font-weight:800;color:var(--made)}
.cold{font-weight:800;color:var(--miss)}
.stand .wrap-s{max-width:820px;margin:0 auto;padding:0 14px 60px}
.pbtn{margin:14px 0}

@media (min-width:760px){
  .pl{min-height:104px}
  .ab{min-height:66px}
  .two{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  :root:root:root{
    --bg:#fff; --surface:#fff; --surface-2:#F1F4F8; --ink:#0E1A2B; --muted:#586579; --line:#D0D8E2;
    --court:#1A5DA8; --court-fg:#1A5DA8; --court-soft:#DCE8F6; --made:#0F7A50; --miss:#B4332A; --opp:#C2570A;
    --ct-floor:#EEF2F7; --ct-paint:#CFE0F3; --ct-line:#7F95AF;
  }
  .nav,.undo,.toast,.rep-bar,.noprint{display:none!important}
  body{background:#fff}
  .wrap{padding-bottom:0}
  .rep section{break-inside:avoid}
}

/* ---------- ambos equipos en una pantalla ---------- */
.side{margin-top:12px}
.side-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;min-height:36px}
.side-h h2{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.side-h h2::before{content:'';flex:none;width:10px;height:10px;border-radius:3px;background:var(--court)}
.side.opp .side-h h2::before{background:var(--opp)}
.pls .pl{min-height:88px}
.pls.wide{grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.pls.wide .pl.sm{min-height:62px}
.pl.sm{padding:5px 2px;gap:1px;border-radius:12px}
.pl.sm b{font-size:26px}
.pl.sm .fd i{width:5px;height:5px}
.pl.sm .pt{font-size:11px}
.pl.add.sm{font-size:22px;font-weight:600}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.who .w{flex:1;min-width:0;padding:9px 12px;border-radius:10px;background:var(--surface);border-left:5px solid var(--line);font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .w b{color:var(--ink)}
.who .w.us{border-left-color:var(--court)}
.who .w.opp{border-left-color:var(--opp)}
.acts{margin-top:8px}
.sb-top{position:relative;display:flex;justify-content:center;margin-bottom:8px}
.sb-tm{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:12.5px;min-height:30px}
.sb-tm:active{background:rgba(255,255,255,.4)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16);color:inherit}
.sync i{width:8px;height:8px;border-radius:50%;background:#9AE6B4}
.sync.wait i,.sync.busy i,.sync.off i{background:#FFC857}
.sync.err i{background:#FF8A80}
.sync.local i{background:#fff;opacity:.6}
.setg .sync{background:var(--surface-2);color:var(--ink)}
.setg .sync i{background:var(--made)}
.setg .sync.wait i,.setg .sync.busy i,.setg .sync.off i{background:var(--foul)}
.setg .sync.err i{background:var(--miss)}
.setg .sync.local i{background:var(--muted)}

/* ---------- cuatro factores ---------- */
.ff{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 10px}
.ff-h{display:flex;justify-content:space-between;padding:8px 0 2px;font-size:13px;font-weight:700}
.ff-h span:last-child{color:var(--opp-fg)}
.ff-h span:first-child{color:var(--court-fg)}
.ff-r{padding:9px 0;border-top:1px solid var(--line)}
.ff-h+.ff-r{border-top:0}
.ff-t{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:5px}
.ff-t b{font:800 20px/1 var(--font-display);letter-spacing:.02em}
.ff-t small{color:var(--muted);font-size:12px;margin-top:2px}
.ff-c{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:8px}
.ff-v{font-weight:600;font-size:15px}
.ff-v:last-child{text-align:right}
.ff-v.win{font-weight:800;color:var(--made)}
.ff-b{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ff-b span{display:flex;height:12px;background:var(--surface-2)}
.ff-b .l{justify-content:flex-end;border-radius:6px 0 0 6px}
.ff-b .r{justify-content:flex-start;border-radius:0 6px 6px 0}
.ff-b i{display:block;height:100%}
.ff-b .l i{background:var(--court);border-radius:6px 0 0 6px}
.ff-b .r i{background:var(--opp);border-radius:0 6px 6px 0}
.ff-s{margin:10px 0 0;font-size:14px;color:var(--muted)}
.formulas{padding:4px 0 0;font-size:13.5px;color:var(--muted)}
.formulas li{padding:6px 0;border-bottom:1px solid var(--line)}
.formulas b{color:var(--ink)}

/* =====================================================================
   Distribución por tamaño de pantalla
   móvil: equipo, rival y acciones apilados
   tablet vertical: equipos en dos columnas, acciones debajo
   tablet horizontal: tu equipo | acciones | rival
   ===================================================================== */
.live-grid{display:grid;gap:0;grid-template-areas:"us" "opp" "act"}
.live-grid .side.us{grid-area:us}
.live-grid .side.opp{grid-area:opp}
.live-grid .center{grid-area:act;min-width:0}
.undo-in{display:none;margin-top:10px;min-height:48px;justify-content:flex-start}
.undo-in svg{flex:none}
.undo-in span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet.map .court{width:auto;max-width:100%;max-height:calc(92vh - 210px);max-height:calc(92dvh - 210px);margin:0 auto}

@media (min-width:600px){
  .live-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"us opp" "act act";column-gap:16px}
  .side.us .pls{grid-template-columns:1fr;gap:8px}
  .side.us .pl{flex-direction:row;justify-content:flex-start;gap:12px;min-height:66px;padding:6px 14px}
  .side.us .pl b{font-size:38px;min-width:46px;text-align:center}
  .side.us .pl .nm{flex:1;text-align:left;font-size:16px;font-weight:500;color:var(--ink);padding:0}
  .side.us .pl.sel .nm{color:inherit}
  .side.us .pl .pt{font-size:14px;min-width:54px;text-align:right}
  .side.opp .pls.wide{grid-template-columns:repeat(3,1fr);gap:8px}
  .side.opp .pl.sm{min-height:66px}
  .side.opp .pl.sm b{font-size:30px}
  .ab{min-height:66px}
  .center .who{margin-top:14px}
}
@media (min-width:700px){
  .live-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);grid-template-areas:"us act opp";column-gap:14px;align-items:start}
  .center .who{margin-top:0}
  .side-h{min-height:44px}
  .ab b{font-size:28px}
  .undo-in{display:inline-flex}
  .undo{display:none}
  .side.us .pl{gap:8px;padding:6px 10px}
  .side.us .pl b{min-width:40px}
  .side.opp .pls.wide{gap:6px}
  .center .who .w{font-size:13px;padding:8px 10px}
}
@media (min-width:900px){
  .wrap.live{max-width:1240px}
  .wrap.stats,.wrap.report{max-width:1000px}
  .live-grid{column-gap:18px}
  .ab b{font-size:30px}
  .ab{min-height:70px}
  .side.us .pl{gap:12px;padding:6px 14px}
  .center .who .w{font-size:14px;padding:9px 12px}
  .sb{padding:10px 20px 8px}
  .sb-score{font-size:68px}
  .sb-time{font-size:54px}
  .sb-top{position:absolute;top:8px;right:14px;margin:0;z-index:1}
  .sb-meta{margin-top:2px}
  .chiprow{margin-top:8px}
  .blk{margin-top:14px}
}
@media (min-width:900px) and (max-height:820px){
  .ab{min-height:62px}
  .side.us .pl{min-height:60px}
  .side.opp .pl.sm{min-height:58px}
  .sb-score{font-size:58px}
}

.side-h h2 .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side-h h2 .cnt{flex:none;margin-left:2px}

.pt i{font-style:normal}
.who .w{flex:1 1 130px}
.who{flex-wrap:wrap}
@media (min-width:700px) and (max-width:899px){
  .side.us .pl .pt i{display:none}
  .side.us .pl .fd i{width:5px;height:5px}
  .side.us .pl .fd{gap:2px}
  .side.us .pl .pt{min-width:24px}
}

/* botones de las ventanas siempre visibles, aunque la lista sea larga */
.sheet .btns{position:sticky;bottom:0;z-index:2;margin:10px -16px 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.lst{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:20px}

/* ---------- desplegable de fórmulas, ampliado ---------- */
.formulas li{padding:12px 0;display:block}
.formulas li b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:3px}
.formulas li p{margin:0 0 4px;font-size:13.5px;line-height:1.45}
.formulas li p.fm{margin:0;font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.4}

/* ---------- pantalla de entrada (login obligatorio) ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.gate-card{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:30px 26px 26px;box-shadow:0 14px 40px rgba(14,26,43,.14);border:1px solid var(--line)}
.gate-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px}
.gate-mark{width:46px;height:46px;flex:none;border-radius:12px;background:var(--court);color:#fff;display:flex;align-items:center;justify-content:center;font:800 18px var(--font-display);letter-spacing:.02em}
.gate-logo h1{font:800 27px/1 var(--font-display);letter-spacing:.01em}
.gate-sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}
.gate-card .field{margin-bottom:14px}
.gate-card .field:last-of-type{margin-bottom:0}
.gate-switch{text-align:center;font-size:13.5px;color:var(--muted);margin-top:18px}
.gate-switch a{color:var(--court-fg);font-weight:700;text-decoration:underline;cursor:pointer}
.gate-tag{max-width:320px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}

/* ---------- informe: secciones plegables por defecto ---------- */
.rep details{margin-top:26px}
.rep details>summary{font:800 24px/1.1 var(--font-display);letter-spacing:.01em;list-style:none;cursor:pointer;padding-left:24px;position:relative}
.rep details>summary::-webkit-details-marker{display:none}
.rep details>summary::before{content:'';position:absolute;left:2px;top:9px;width:0;height:0;border-style:solid;border-width:6px 0 6px 8px;border-color:transparent transparent transparent var(--muted);transition:transform .15s}
.rep details[open]>summary{margin-bottom:10px}
.rep details[open]>summary::before{transform:rotate(90deg)}

/* ---------- registro: grupo de botones (reasignar / anular) ---------- */
.lb-g{display:flex;gap:6px;flex:none}

/* ---------- selector de dos opciones (nuevo partido: ahora / programado) ---------- */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.seg2 button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted)}
.seg2 button.on{background:var(--court);border-color:var(--court);color:var(--on-court)}
.pill.sched{background:var(--foul-bg);color:var(--foul)}

</style>
</head>

<script>
(function(){
'use strict';
/* =====================================================================
   Estadísticas y scouting de baloncesto — prototipo
   Modelo: cada acción es un EVENTO. Marcador, boxscore, +/- y mapas de
   tiro se calculan a partir de los eventos (igual que en Supabase).
   ===================================================================== */
var LS_KEY='basket-stats-v1';
var $app=document.getElementById('app');

/* ---------- utilidades ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return String(n).padStart(2,'0');}
function mmss(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60);}
function pct(m,a){return a?Math.round(m*100/a)+'%':'–';}
function ma(m,a){return m+'/'+a;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fdate(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function clone(o){return JSON.parse(JSON.stringify(o));}
function norm(s){return String(s||'').trim().toLowerCase();}
function slug(s){return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'rival';}
function byNum(a,b){return (parseInt(a.num,10)||0)-(parseInt(b.num,10)||0);}

/* ---------- constantes ---------- */
var PLAYS=['Pick and roll','Aclarado','Contraataque','Poste','Pantalla indirecta','Segunda opción'];
var DEFS=['Individual','Zona 2-3','Zona 3-2','Zona 1-3-1','Presión','Otra'];
var ZONES=['Bajo el aro','Pintura','Media izq.','Media centro','Media der.','Triple esquina izq.','Triple ala izq.','Triple frontal','Triple ala der.','Triple esquina der.'];
var ACTIONS={
  ft1:{t:'ft',m:true,pts:1}, ft0:{t:'ft',m:false,pts:0},
  s21:{t:'s2',m:true,pts:2}, s20:{t:'s2',m:false,pts:0},
  s31:{t:'s3',m:true,pts:3}, s30:{t:'s3',m:false,pts:0},
  oreb:{t:'oreb'}, dreb:{t:'dreb'}, ast:{t:'ast'}, stl:{t:'stl'}, tov:{t:'tov'}, blk:{t:'blk'}, pf:{t:'pf'}, to:{t:'to'}
};

/* ---------- iconos ---------- */
var I={
  list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  ball:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 10.8 0 12.8M18.4 5.6c-3 3-3 10.8 0 12.8"/></svg>',
  bars:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  doc:'<svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.3c2.4.3 4 2.3 4 4.7"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>'
};

/* ---------- estado guardado ---------- */
var PB=null;function pbUser(){return null;}
var DEF={v:1,team:{name:'Mi equipo'},players:[],games:[],currentId:null,settings:{periodMin:10,otMin:5,map:true,advStats:false,advReport:false},ai:{},sync:{h:{},eu:{},mu:{},team:null,cur:{},tu:0}};
function load(){
  try{
    var r=localStorage.getItem(LS_KEY);
    if(r){
      var o=JSON.parse(r), s=clone(DEF);
      for(var k in o){s[k]=o[k];}
      s.settings=Object.assign({},DEF.settings,o.settings||{});
      s.ai=s.ai||{};s.sync=s.sync||{h:{}};s.sync.h=s.sync.h||{};s.sync.eu=s.sync.eu||{};s.sync.mu=s.sync.mu||{};s.sync.cur=s.sync.cur||{};s.sync.tu=s.sync.tu||0;
      s.games.forEach(function(g){g.running=false;});
      return s;
    }
  }catch(e){}
  return clone(DEF);
}
var S=load();
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,60);}
function saveNow(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  try{if(S.sync&&S.sync.team)localStorage.setItem('basket-team:'+S.sync.team,JSON.stringify(S));}catch(e){}
  try{if(DBX){recount();if(SYNC.pending>0&&!SYNC.hold)schedFlush();}}catch(e){}
}

/* ---------- estado de pantalla (no se guarda) ---------- */
var U={top:false,tab:'games',gamesView:'games',statsScope:'game',gateMode:'signin',side:'us',sel:null,play:null,assist:null,sheet:null,form:{},toast:null,toastT:null,clk:null,scope:'one',aiBusy:false};
var TICK=null, SAMPLE=null, DL=null, DBX=null;
var STANDALONE=true;
function canDL(){return !!DL||STANDALONE;}
var SYNC={busy:false,err:null,pending:0,last:0,t:null};

function cur(){return S.games.find(function(g){return g.id===S.currentId;})||null;}
function pById(id){return S.players.find(function(p){return p.id===id;});}
function lenOf(g,p){return p<=4?g.periodLen:g.otLen;}
function perLabel(p){return p<=4?'C'+p:'PR'+(p-4);}
function lineup(g){
  var s=new Set(g.start||[]);
  g.events.forEach(function(e){if(e.v)return;if(e.t==='out')s.delete(e.k);else if(e.t==='in')s.add(e.k);});
  return Array.from(s);
}
function elapsed(g,p,c){var b=0;for(var i=1;i<p;i++)b+=lenOf(g,i);return b+(lenOf(g,p)-c);}
function newGameObj(opp,date,comp,start,roster,status){
  start=start||[];
  return {id:uid(),opp:opp||'Rival',date:date||today(),comp:comp||'',status:status||'live',
    periodLen:S.settings.periodMin*60,otLen:S.settings.otMin*60,period:1,clock:S.settings.periodMin*60,running:false,
    start:start.slice(),roster:(roster&&roster.length?roster:start).slice(),oppPlayers:[],oppDefense:'Individual',ourDefense:'Individual',events:[]};
}
/* partidos que ya se han jugado (o se están jugando): excluye los programados para no inflar la temporada con partidos que aún no han pasado */
function playedGames(){return S.games.filter(function(g){return g.status!=='scheduled';});}
/* Convocatoria del partido. Los partidos guardados antes de tener esta función no llevan
   la lista, así que se entiende que estaba convocada toda la plantilla. */
function rosterOf(g){return (g.roster&&g.roster.length)?g.roster:S.players.map(function(p){return p.id;});}
var LAST_O=0;
/* orden de creación único y creciente: sirve para colocar bien las acciones de varios dispositivos */
function nextO(){LAST_O=Math.max(Date.now()*1000,LAST_O+1);return LAST_O;}
function addEvent(g,o){
  var e=Object.assign({id:uid(),p:g.period,c:Math.ceil(g.clock),v:false,ts:Date.now(),u:Date.now(),o:nextO()},o);
  g.events.push(e);return e;
}

/* ---------- zonas de tiro (media pista FIBA, 600x560, canasta en 300,63) ---------- */
function zoneOf(x,y){
  var dx=x-300,dy=y-63,d=Math.hypot(dx,dy),ang=Math.atan2(dx,dy)*180/Math.PI;
  var corner=y<=120;
  var three=corner?Math.abs(dx)>=264:d>=270;
  if(three){
    if(corner)return dx<0?'Triple esquina izq.':'Triple esquina der.';
    if(Math.abs(ang)>=35)return dx<0?'Triple ala izq.':'Triple ala der.';
    return 'Triple frontal';
  }
  if(d<72)return 'Bajo el aro';
  if(x>=202&&x<=398&&y<=232)return 'Pintura';
  if(ang<-32)return 'Media izq.';
  if(ang>32)return 'Media der.';
  return 'Media centro';
}

/* ---------- cálculo de estadísticas a partir de eventos ---------- */
function blank(){return {pts:0,s2m:0,s2a:0,s3m:0,s3a:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,tov:0,blk:0,pf:0,drew:0,min:0,pm:0};}
function apply(st,e){
  st.pts+=e.pts||0;
  switch(e.t){
    case 's2':st.s2a++;if(e.m)st.s2m++;break;
    case 's3':st.s3a++;if(e.m)st.s3m++;break;
    case 'ft':st.fta++;if(e.m)st.ftm++;break;
    case 'oreb':st.oreb++;break;case 'dreb':st.dreb++;break;
    case 'ast':st.ast++;break;case 'stl':st.stl++;break;case 'tov':st.tov++;break;
    case 'blk':st.blk++;break;case 'pf':st.pf++;break;
  }
}
function D(st){
  var fga=st.s2a+st.s3a,fgm=st.s2m+st.s3m,reb=st.oreb+st.dreb;
  var poss=fga+0.44*st.fta-st.oreb+st.tov;
  var tsd=2*(fga+0.44*st.fta),tovd=fga+0.44*st.fta+st.tov;
  return {fga:fga,fgm:fgm,reb:reb,poss:poss,ppp:poss>0?st.pts/poss:0,
    efg:fga?(fgm+0.5*st.s3m)/fga:0,          /* eFG% = (TC + 0,5 x T3) / TCI */
    ts:tsd?st.pts/tsd:0,                     /* TS% = PTS / (2 x (TCI + 0,44 x TLI)) */
    tovp:tovd?st.tov/tovd:0,                 /* TOV% = PER / (TCI + 0,44 x TLI + PER) */
    ftr:fga?st.ftm/fga:0};                   /* FT/FGA = TL anotados / TC intentados */
}
/* Cuatro factores (Dean Oliver) + valoración ofensiva/defensiva por 100 posesiones */
function factors(A){
  var du=D(A.us),dO=D(A.opp),poss=(du.poss+dO.poss)/2;
  function orb(own,opp){var d=own.oreb+opp.dreb;return d?own.oreb/d:0;}
  function drb(own,opp){var d=own.dreb+opp.oreb;return d?own.dreb/d:0;}
  function pack(d,own,opp){return {efg:d.efg,ts:d.ts,tov:d.tovp,orb:orb(own,opp),drb:drb(own,opp),ftr:d.ftr,rtg:poss>0?100*own.pts/poss:0};}
  var us=pack(du,A.us,A.opp),opp=pack(dO,A.opp,A.us);
  /* El Net Rating de un equipo es su valoración ofensiva menos la valoración ofensiva del rival
     (que es, a la vez, la valoración defensiva del primero, porque comparten las mismas posesiones). */
  us.net=us.rtg-opp.rtg;opp.net=opp.rtg-us.rtg;
  return {poss:poss,us:us,opp:opp};
}
/* Puntos por tiro de campo (PPS) */
function pps(st){var fga=st.s2a+st.s3a;return fga?st.pts/fga:0;}
/* Puntos por tiro, desglosados por tipo (TL vale 1, T2 vale 2, T3 vale 3) */
function pps1(st){return st.fta?st.ftm/st.fta:0;}
function pps2(st){return st.s2a?st.s2m*2/st.s2a:0;}
function pps3(st){return st.s3a?st.s3m*3/st.s3a:0;}
/* Asistencias por cada pérdida */
function astTo(st){return st.tov?st.ast/st.tov:(st.ast?Infinity:0);}
function fmtRatio(v){return v===Infinity?'\u221e':v.toFixed(2);}
/* Estadísticas de "momentos de presión": últimos 5 minutos del último periodo jugado
   (el 4º cuarto o cualquier prórroga), con el marcador a 5 puntos o menos. */
function clutchTotals(games){
  var C={us:blank(),opp:blank()};
  games.forEach(function(g){
    var margin=0;
    g.events.forEach(function(e){
      if(e.v||e.t==='in'||e.t==='out'||e.t==='to')return;
      var win=e.p>=4&&e.c<=Math.min(300,lenOf(g,e.p));
      if(win&&Math.abs(margin)<=5)apply(e.side==='us'?C.us:C.opp,e);
      if(e.pts)margin+=e.side==='us'?e.pts:-e.pts;
    });
  });
  return C;
}
function analyze(games){
  var A={games:games.length,us:blank(),opp:blank(),pl:{},op:{},per:{},shots:{us:[],opp:[]},play:{},oplay:{},def:{},odef:{},units:{},flow:[],to:{us:0,opp:0},total:0,events:0};
  games.forEach(function(g){
    var on=new Set(g.start||[]),last=0,d=0;
    if(games.length===1)A.flow.push({t:0,d:0});
    function unit(){
      if(!on.size)return null;
      var ids=Array.from(on).sort(),key=ids.join('|');
      return A.units[key]||(A.units[key]={ids:ids,min:0,pf:0,pa:0});
    }
    g.events.forEach(function(e){
      if(e.v)return;
      A.events++;
      var el=elapsed(g,e.p,e.c),dt=Math.max(0,el-last);
      if(dt>0&&on.size){
        on.forEach(function(id){(A.pl[id]||(A.pl[id]=blank())).min+=dt;});
        unit().min+=dt;
      }
      if(el>last)last=el;
      if(e.t==='in'){on.add(e.k);return;}
      if(e.t==='out'){on.delete(e.k);return;}
      if(e.t==='to'){A.to[e.side]++;return;}
      apply(e.side==='us'?A.us:A.opp,e);
      if(e.k){var map=e.side==='us'?A.pl:A.op;apply(map[e.k]||(map[e.k]=blank()),e);}
      if(e.t==='pf'&&e.rec){var rmap=e.side==='us'?A.op:A.pl;(rmap[e.rec]||(rmap[e.rec]=blank())).drew++;}
      if(e.pts){
        var pr=A.per[e.p]||(A.per[e.p]={us:0,opp:0});pr[e.side]+=e.pts;
        on.forEach(function(id){(A.pl[id]||(A.pl[id]=blank())).pm+=e.side==='us'?e.pts:-e.pts;});
        var u=unit();if(u){if(e.side==='us')u.pf+=e.pts;else u.pa+=e.pts;}
        d+=e.side==='us'?e.pts:-e.pts;
        if(games.length===1)A.flow.push({t:el,d:d});
      }
      if(e.x!=null)A.shots[e.side].push({x:e.x,y:e.y,m:!!e.m,t:e.t,k:e.k,z:e.z});
      if(e.play){var ptgt=e.side==='opp'?A.play:A.oplay,pp=ptgt[e.play]||(ptgt[e.play]={n:0,pts:0});pp.n++;pp.pts+=e.pts||0;}
      if(e.def){
        var dtgt=e.side==='us'?A.def:A.odef;
        var dd=dtgt[e.def]||(dtgt[e.def]={fga:0,fgm:0,pts:0,tov:0,s3a:0,s3m:0});
        if(e.t==='s2'||e.t==='s3'){dd.fga++;if(e.m){dd.fgm++;dd.pts+=e.pts;}if(e.t==='s3'){dd.s3a++;if(e.m)dd.s3m++;}}
        else if(e.t==='tov')dd.tov++;
      }
    });
    if(games.length===1)A.flow.push({t:last,d:d});
    A.total+=last;
  });
  return A;
}
function seasonGamesPlayed(games){
  var gp={};
  games.forEach(function(g){
    var A1=analyze([g]);
    Object.keys(A1.pl).forEach(function(id){if(A1.pl[id].min>0)gp[id]=(gp[id]||0)+1;});
  });
  return gp;
}
function rivalsList(){
  var by={};
  playedGames().forEach(function(g){
    var key=norm(g.opp);
    var r=by[key]||(by[key]={key:key,name:g.opp,games:[],w:0,l:0,t:0,finished:0,last:''});
    r.games.push(g);
    if((g.date||'')>r.last){r.last=g.date||'';r.name=g.opp;}  /* nombre y fecha del más reciente */
    if(g.status==='done'){
      r.finished++;
      var a=analyze([g]);
      if(a.us.pts>a.opp.pts)r.w++;else if(a.us.pts<a.opp.pts)r.l++;else r.t++;
    }
  });
  return Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return (b.last||'').localeCompare(a.last||'');});
}
function seasonRecord(games){
  var w=0,l=0,t=0,finished=0;
  games.forEach(function(g){
    if(g.status!=='done')return;
    finished++;var a=analyze([g]);
    if(a.us.pts>a.opp.pts)w++;else if(a.us.pts<a.opp.pts)l++;else t++;
  });
  return {w:w,l:l,t:t,finished:finished};
}
function foulsTeam(g,side,p){return g.events.filter(function(e){return !e.v&&e.t==='pf'&&e.side===side&&e.p===p;}).length;}
function halfOf(p){return p<=2?1:(p<=4?2:p);}
function timeoutsHalf(g,side){var h=halfOf(g.period);return g.events.filter(function(e){return !e.v&&e.t==='to'&&e.side===side&&halfOf(e.p)===h;}).length;}

/* ---------- descripciones ---------- */
function teamName(side,g){return side==='us'?S.team.name:(g?g.opp:'Rival');}
function who(e,g){
  if(e.side==='us'){var p=pById(e.k);return p?('#'+p.num+' '+(p.name||'')).trim():esc0(S.team.name);}
  return e.k?(e.k==='EQ'?g.opp+' (equipo)':g.opp+' #'+e.k):g.opp;
}
function esc0(s){return s;}
function what(e){
  switch(e.t){
    case 's2':return e.m?'Canasta de 2 (+2)':'Tiro de 2 fallado';
    case 's3':return e.m?'Triple anotado (+3)':'Triple fallado';
    case 'ft':return e.m?'Tiro libre anotado (+1)':'Tiro libre fallado';
    case 'oreb':return 'Rebote de ataque';case 'dreb':return 'Rebote de defensa';
    case 'ast':return 'Asistencia';case 'stl':return 'Robo';case 'tov':return 'Pérdida';case 'blk':return 'Tapón';
    case 'pf':return 'Falta personal';case 'in':return 'Entra';case 'out':return 'Sale';case 'to':return 'Tiempo muerto';
  }
  return e.t;
}
function evLine(e,g){
  if(e.t==='to')return teamName(e.side,g)+': Tiempo muerto';
  return who(e,g)+': '+what(e)+(e.z?' ('+e.z.toLowerCase()+')':'');
}
function groupLine(list,g){
  var ins=list.filter(function(e){return e.t==='in';}).map(function(e){var p=pById(e.k);return p?'#'+p.num:'?';});
  var outs=list.filter(function(e){return e.t==='out';}).map(function(e){var p=pById(e.k);return p?'#'+p.num:'?';});
  return 'Cambio: entra '+(ins.join(', ')||'–')+'; sale '+(outs.join(', ')||'–');
}
function logHTML(g,n){
  var rows=[],seen={};
  for(var i=g.events.length-1;i>=0&&(n==null||rows.length<n);i--){
    var e=g.events[i];
    if(e.grp){
      if(seen[e.grp])continue;seen[e.grp]=1;
      var grp=g.events.filter(function(x){return x.grp===e.grp;});
      rows.push('<li class="lg us'+(e.v?' void':'')+'"><span class="lt">'+perLabel(e.p)+' '+mmss(e.c)+'</span><span class="lx">'+esc(groupLine(grp,g))+'</span><button class="lb" data-a="voidEv" data-id="'+e.id+'">'+(e.v?'Restaurar':'Anular')+'</button></li>');
    }else{
      var canReassign=!e.v&&e.side==='us'&&e.k;
      rows.push('<li class="lg '+e.side+(e.v?' void':'')+'"><span class="lt">'+perLabel(e.p)+' '+mmss(e.c)+'</span><span class="lx">'+esc(evLine(e,g))+'</span><span class="lb-g">'+(canReassign?'<button class="lb" data-a="openReassign" data-id="'+e.id+'">Reasignar</button>':'')+'<button class="lb" data-a="voidEv" data-id="'+e.id+'">'+(e.v?'Restaurar':'Anular')+'</button></span></li>');
    }
  }
  return rows.length?rows.join(''):'<li class="empty">Todavía no hay acciones. Toca un jugador y luego una acción.</li>';
}
function setVoid(g,id,val){
  var e=g.events.find(function(x){return x.id===id;});if(!e)return;
  var set={};set[id]=1;
  if(e.grp)g.events.forEach(function(x){if(x.grp===e.grp)set[x.id]=1;});
  g.events.forEach(function(x){if(x.rel&&set[x.rel])set[x.id]=1;});
  var nowU=Date.now();g.events.forEach(function(x){if(set[x.id]){x.v=val;x.u=nowU;}});
}
function lastActive(g){for(var i=g.events.length-1;i>=0;i--){if(!g.events[i].v)return g.events[i];}return null;}

function contextPanel(g){
  var defs='<div class="chiprow"><span class="lbl">Defensa rival</span>'+DEFS.map(function(d){return '<button class="chip'+(g.oppDefense===d?' on':'')+'" data-a="def" data-v="'+esc(d)+'">'+esc(d)+'</button>';}).join('')+'</div>';
  var plays='<div class="chiprow"><span class="lbl">Jugada rival</span>'+PLAYS.map(function(p){return '<button class="chip'+(U.play===p?' on':'')+'" data-a="play" data-v="'+esc(p)+'">'+esc(p)+'</button>';}).join('')+'</div>';
  var odefs='<div class="chiprow"><span class="lbl">Nuestra defensa</span>'+DEFS.map(function(d){return '<button class="chip'+((g.ourDefense||'Individual')===d?' on':'')+'" data-a="odef" data-v="'+esc(d)+'">'+esc(d)+'</button>';}).join('')+'</div>';
  var oplays='<div class="chiprow"><span class="lbl">Nuestra jugada</span>'+PLAYS.map(function(p){return '<button class="chip'+(U.oplay===p?' on':'')+'" data-a="oplay" data-v="'+esc(p)+'">'+esc(p)+'</button>';}).join('')+'</div>';
  return odefs+oplays+(U.oplay?'<p class="hint sm">Nuestra jugada elegida: <b>'+esc(U.oplay)+'</b>. Se aplica a nuestro siguiente tiro o pérdida.</p>':'')
   +defs+plays+(U.play?'<p class="hint sm">Jugada elegida: <b>'+esc(U.play)+'</b>. Se aplica al siguiente tiro o pérdida del rival.</p>':'');
}

/* ---------- métricas avanzadas ---------- */
function fpct(x){return (x*100).toFixed(1)+'%';}
function ffRow(title,desc,u,o,dir){
  var better=u===o?'':((dir==='hi'?u>o:u<o)?'us':'opp');
  var mx=Math.max(u,o,0.0001)*1.05;
  return '<div class="ff-r"><div class="ff-t"><b>'+title+'</b><small>'+desc+'</small></div><div class="ff-c"><span class="ff-v'+(better==='us'?' win':'')+'">'+fpct(u)+'</span>'
    +'<div class="ff-b"><span class="l"><i style="width:'+(u/mx*100).toFixed(1)+'%"></i></span><span class="r"><i style="width:'+(o/mx*100).toFixed(1)+'%"></i></span></div>'
    +'<span class="ff-v'+(better==='opp'?' win':'')+'">'+fpct(o)+'</span></div></div>';
}
function advancedHTML(A){
  var F=factors(A),u=F.us,o=F.opp,w=0;
  if(u.efg>o.efg)w++;if(u.tov<o.tov)w++;if(u.orb>o.orb)w++;if(u.ftr>o.ftr)w++;
  var tot=(A.us.s2a+A.us.s3a+A.opp.s2a+A.opp.s3a);
  if(!tot)return '<p class="empty">Las métricas aparecen cuando haya tiros registrados.</p>';
  var au=astTo(A.us),ao=astTo(A.opp);
  return '<div class="ff"><div class="ff-h"><span>'+esc(S.team.name)+'</span><span>Rival</span></div>'
   +ffRow('eFG%','Acierto efectivo: cuenta el triple a 1,5',u.efg,o.efg,'hi')
   +ffRow('TOV%','Jugadas que acaban en pérdida (menos es mejor)',u.tov,o.tov,'lo')
   +ffRow('ORB%','Rebotes de ataque sobre los disponibles',u.orb,o.orb,'hi')
   +ffRow('FT/FGA','Tiros libres anotados por tiro de campo intentado',u.ftr,o.ftr,'hi')
   +'</div><p class="ff-s">'+(w>=3?esc(S.team.name)+' gana ':(w===2?'Reparto: '+esc(S.team.name)+' gana ':esc(S.team.name)+' solo gana '))+w+' de los 4 factores.</p>'
   +'<div class="tw" style="margin-top:12px"><table class="t"><thead><tr><th></th><th>'+esc(S.team.name)+'</th><th>Rival</th></tr></thead><tbody>'
   +'<tr><td>TS% (acierto real)</td><td'+(u.ts>o.ts?' class="best"':'')+'>'+fpct(u.ts)+'</td><td'+(o.ts>u.ts?' class="best"':'')+'>'+fpct(o.ts)+'</td></tr>'
   +'<tr><td>DRB% (rebotes de defensa)</td><td'+(u.drb>o.drb?' class="best"':'')+'>'+fpct(u.drb)+'</td><td'+(o.drb>u.drb?' class="best"':'')+'>'+fpct(o.drb)+'</td></tr>'
   +'<tr><td>Asistencias por pérdida</td><td'+(au>ao?' class="best"':'')+'>'+fmtRatio(au)+'</td><td'+(ao>au?' class="best"':'')+'>'+fmtRatio(ao)+'</td></tr>'
   +'<tr><td>Posesiones (estimadas)</td><td>'+Math.round(F.poss)+'</td><td>'+Math.round(F.poss)+'</td></tr>'
   +'<tr><td>Valoración ofensiva (pts/100 pos.)</td><td'+(u.rtg>o.rtg?' class="best"':'')+'>'+u.rtg.toFixed(1)+'</td><td'+(o.rtg>u.rtg?' class="best"':'')+'>'+o.rtg.toFixed(1)+'</td></tr>'
   +'<tr><td>Net Rating</td><td class="'+(u.net>0?'pos':u.net<0?'neg':'')+'">'+sgnf(u.net)+'</td><td class="'+(o.net>0?'pos':o.net<0?'neg':'')+'">'+sgnf(o.net)+'</td></tr>'
   +'</tbody></table></div>';
}
/* ---------- momentos de presión (clutch) ---------- */
function clutchHTML(list){
  var C=clutchTotals(list),du=D(C.us),dO=D(C.opp);
  var sample=du.fga+C.us.fta+dO.fga+C.opp.fta;
  if(!sample)return '<p class="empty">Sin acciones registradas en los últimos 5 minutos con el marcador a 5 puntos o menos.</p>';
  var au=astTo(C.us),ao=astTo(C.opp);
  return '<div class="res" style="margin:2px 0 12px"><div><b>'+esc(S.team.name)+' vs rival</b><div class="mut" style="font-size:13px">Últimos 5 min del periodo decisivo, diferencia ≤5</div></div><div class="sc" style="font-size:32px">'+C.us.pts+'-'+C.opp.pts+'</div></div>'
   +'<div class="tw"><table class="t"><thead><tr><th></th><th>'+esc(S.team.name)+'</th><th>Rival</th></tr></thead><tbody>'
   +'<tr><td>Tiros de campo</td><td'+(du.fgm/Math.max(1,du.fga)>dO.fgm/Math.max(1,dO.fga)?' class="best"':'')+'>'+ma(du.fgm,du.fga)+' ('+pct(du.fgm,du.fga)+')</td><td'+(dO.fgm/Math.max(1,dO.fga)>du.fgm/Math.max(1,du.fga)?' class="best"':'')+'>'+ma(dO.fgm,dO.fga)+' ('+pct(dO.fgm,dO.fga)+')</td></tr>'
   +'<tr><td>eFG%</td><td'+(du.efg>dO.efg?' class="best"':'')+'>'+fpct(du.efg)+'</td><td'+(dO.efg>du.efg?' class="best"':'')+'>'+fpct(dO.efg)+'</td></tr>'
   +'<tr><td>Tiros libres</td><td>'+ma(C.us.ftm,C.us.fta)+'</td><td>'+ma(C.opp.ftm,C.opp.fta)+'</td></tr>'
   +'<tr><td>Pérdidas</td><td'+(C.us.tov<C.opp.tov?' class="best"':'')+'>'+C.us.tov+'</td><td'+(C.opp.tov<C.us.tov?' class="best"':'')+'>'+C.opp.tov+'</td></tr>'
   +'<tr><td>Asistencias</td><td'+(C.us.ast>C.opp.ast?' class="best"':'')+'>'+C.us.ast+'</td><td'+(C.opp.ast>C.us.ast?' class="best"':'')+'>'+C.opp.ast+'</td></tr>'
   +'<tr><td>Faltas</td><td'+(C.us.pf<C.opp.pf?' class="best"':'')+'>'+C.us.pf+'</td><td'+(C.opp.pf<C.us.pf?' class="best"':'')+'>'+C.opp.pf+'</td></tr>'
   +'</tbody></table></div>'
   +(sample<8?'<p class="mut" style="font-size:13px;margin-top:8px">Pocas acciones en esta franja ('+sample+'); son datos orientativos.</p>':'');
}
function fdef(name,what,why,formula){
  return '<li><b>'+name+'</b><p>'+what+' '+why+'</p><p class="fm">'+formula+'</p></li>';
}
function formulasHTML(){
  return '<details><summary>Qué significan y cómo se calculan</summary><ul class="formulas">'
   +fdef('eFG% (acierto efectivo)',
     'El porcentaje de acierto en tiros de campo, pero contando el triple como 1,5 aciertos en vez de 1, porque vale más puntos.',
     'Sirve para comparar el acierto real de dos equipos o jugadores aunque uno tire muchos más triples que otro: un 40% en triples no es lo mismo que un 40% en tiros de 2, y el eFG% lo refleja.',
     'eFG% = (tiros de 2 anotados + tiros de 3 anotados + 0,5 × tiros de 3 anotados) ÷ tiros de campo intentados')
   +fdef('TS% (acierto real)',
     'Como el eFG%, pero contando también los tiros libres.',
     'Es la foto más completa de la eficiencia anotadora de un jugador o equipo, porque junta las tres formas de sumar puntos en una sola cifra.',
     'TS% = puntos ÷ (2 × (tiros de campo intentados + 0,44 × tiros libres intentados))')
   +fdef('TOV% (pérdidas por posesión)',
     'De cada 100 posesiones aproximadas, cuántas acaban en pérdida en vez de en tiro o falta recibida.',
     'Las pérdidas totales dependen del ritmo del partido; el TOV% permite comparar el cuidado del balón de dos equipos que juegan a ritmos distintos.',
     'TOV% = pérdidas ÷ (tiros de campo intentados + 0,44 × tiros libres intentados + pérdidas)')
   +fdef('ORB% (rebote de ataque)',
     'De todos los rebotes de ataque que hubo disponibles en el partido, qué parte coge tu equipo.',
     'Cuenta las segundas oportunidades: un equipo puede fallar mucho y aun así anotar si pelea bien estos rebotes.',
     'ORB% = rebotes de ataque ÷ (rebotes de ataque + rebotes de defensa del rival)')
   +fdef('DRB% (rebote de defensa)',
     'Lo mismo que el ORB% pero en defensa: qué parte de los rebotes defensivos disponibles coge tu equipo.',
     'Un DRB% alto significa que se cierra bien el rebote y se evita dar tiros de más al rival.',
     'DRB% = rebotes de defensa ÷ (rebotes de defensa + rebotes de ataque del rival)')
   +fdef('FT/FGA (tiros libres por tiro de campo)',
     'Cuántos tiros libres se anotan por cada tiro de campo intentado.',
     'Un número alto suele indicar un equipo que ataca el aro y provoca faltas; uno bajo, un equipo que se queda tirando desde fuera.',
     'FT/FGA = tiros libres anotados ÷ tiros de campo intentados')
   +fdef('Asistencias por pérdida',
     'Cuántas asistencias se dan por cada pérdida que se comete.',
     'Mide el control colectivo del balón: un ataque ordenado, con buena circulación, suele dar más asistencias de las que pierde el balón.',
     'Asistencias ÷ pérdidas')
   +fdef('PPS (puntos por tiro)',
     'Los puntos que produce, de media, cada tiro de campo (sin contar los libres).',
     'Compara directamente la rentabilidad de un tirador de 2 con uno de 3: un jugador con menos acierto pero que tira triples puede tener un PPS más alto que otro que mete más tiros de 2.',
     'PPS = puntos de tiros de campo ÷ tiros de campo intentados')
   +fdef('Posesiones (estimadas)',
     'Un cálculo aproximado de cuántas veces tuvo el balón cada equipo durante el partido.',
     'Sirve de base para "normalizar" otras métricas y comparar equipos que juegan a ritmos distintos: no es lo mismo anotar 80 puntos en 70 posesiones que en 90.',
     'Posesiones = tiros de campo intentados + 0,44 × tiros libres intentados − rebotes de ataque + pérdidas (media de los dos equipos)')
   +fdef('Valoración ofensiva',
     'Los puntos que anota un equipo por cada 100 posesiones, en vez de por partido.',
     'Al no depender del ritmo de juego, permite comparar el ataque de dos equipos aunque uno juegue mucho más rápido que el otro. La valoración defensiva de tu equipo es, en realidad, la valoración ofensiva del rival, porque ambos comparten las mismas posesiones.',
     'Valoración ofensiva = puntos ÷ posesiones × 100')
   +fdef('Net Rating',
     'La diferencia entre lo que anota tu equipo cada 100 posesiones y lo que encaja.',
     'Resume en un solo número si un equipo domina el partido o si el resultado final esconde rachas de suerte: un Net Rating positivo alto suele indicar una ventaja sólida, no puntual.',
     'Net Rating = valoración ofensiva − valoración defensiva (la ofensiva del rival)')
   +fdef('Momentos de presión',
     'Las estadísticas de los últimos 5 minutos del periodo decisivo (4º cuarto o prórroga), contando solo las acciones en las que el marcador estaba a 5 puntos o menos.',
     'Es donde se deciden los partidos ajustados; un equipo puede dominar casi todo el partido y aun así perderlo si falla en estos minutos, o al revés.',
     'Acciones con periodo ≥ 4º cuarto, últimos 5 minutos de ese periodo, y diferencia de marcador de 5 puntos o menos en ese instante')
   +'</ul></details>';
}

function ppsCell(m,a,val){return a?'<td>'+ma(m,a)+' · <b>'+val.toFixed(2)+'</b></td>':'<td>–</td>';}
function ppsTypeTable(rows){
  if(!rows.length)return '<p class="empty">Aún no hay tiros registrados.</p>';
  return '<div class="tw"><table class="t"><thead><tr><th>Jugador</th><th>TL (m/i · PPS)</th><th>T2 (m/i · PPS)</th><th>T3 (m/i · PPS)</th></tr></thead><tbody>'+rows.map(function(r){
    var s=r.s;
    return '<tr><td>'+r.label+'</td>'+ppsCell(s.ftm,s.fta,pps1(s))+ppsCell(s.s2m,s.s2a,pps2(s))+ppsCell(s.s3m,s.s3a,pps3(s))+'</tr>';
  }).join('')+'</tbody></table></div>';
}
function ourPPSType(A){
  var used=S.players.filter(function(p){return A.pl[p.id];}).sort(byNum);
  return ppsTypeTable(used.map(function(p){return {label:'<b>'+esc(p.num)+'</b> '+esc(p.name),s:A.pl[p.id]};}));
}
function oppPPSType(A){
  return ppsTypeTable(oppRows(A).map(function(r){return {label:'<b>'+(r.k==='EQ'?'Equipo':'#'+esc(r.k))+'</b>',s:r.s};}));
}
function ppsBreakdownHTML(A){
  return '<h3 style="font:800 18px/1 var(--font-display);margin:4px 0 8px">'+esc(S.team.name)+'</h3>'+ourPPSType(A)
   +'<h3 style="font:800 18px/1 var(--font-display);margin:16px 0 8px">Rival</h3>'+oppPPSType(A)
   +'<p class="mut" style="font-size:13px;margin-top:8px">PPS = puntos que da, de media, cada tiro de ese tipo (tiro libre vale 1, de 2 vale 2, de 3 vale 3). Es igual que el porcentaje de acierto, pero ya multiplicado por el valor del tiro: así se comparan directamente un buen tirador de 2 con uno de 3.</p>';
}
/* ---------- Estadísticas (boxscore) ---------- */
function gameHead(g,A){
  return '<div class="res"><div><b>'+esc(S.team.name)+' vs '+esc(g.opp)+'</b><div class="mut" style="font-size:13px">'+fdate(g.date)+(g.comp?', '+esc(g.comp):'')+'</div></div><div class="sc">'+A.us.pts+'-'+A.opp.pts+'</div></div>';
}
function sgn(n){return (n>0?'+':'')+n;}
function sgnf(n){return (n>0?'+':'')+n.toFixed(1);}
function pc(v,ok){return ok?Math.round(v*100)+'%':'–';}
function shootCells(s,adv){if(!adv)return '';var d=D(s);return '<td>'+pc(d.efg,d.fga>0)+'</td><td>'+pc(d.ts,d.fga+s.fta>0)+'</td><td>'+(d.fga?pps(s).toFixed(2):'–')+'</td>';}
function advTh(adv){return adv?'<th>eFG%</th><th>TS%</th><th>PPS</th>':'';}
function advSwitch(key,label){return '<button class="tg'+(S.settings[key]?' on':'')+'" role="switch" aria-checked="'+(S.settings[key]?'true':'false')+'" data-a="advToggle" data-k="'+key+'">'+label+'<span class="sw"></span></button>';}
function ourBox(A,g,adv){
  var used=S.players.filter(function(p){return A.pl[p.id]||g.start.indexOf(p.id)>=0;}).sort(byNum);
  var rows=used.map(function(p){
    var s=A.pl[p.id]||blank();
    return '<tr><td><b>'+esc(p.num)+'</b> '+esc(p.name)+'</td><td>'+mmss(s.min)+'</td><td><b>'+s.pts+'</b></td><td>'+ma(s.s2m,s.s2a)+'</td><td>'+ma(s.s3m,s.s3a)+'</td><td>'+ma(s.ftm,s.fta)+'</td>'+shootCells(s,adv)+'<td>'+(s.oreb+s.dreb)+'</td><td>'+s.ast+'</td><td>'+s.stl+'</td><td>'+s.tov+'</td><td>'+s.blk+'</td><td>'+s.pf+'</td><td>'+s.drew+'</td><td class="'+(s.pm>0?'pos':s.pm<0?'neg':'')+'">'+sgn(s.pm)+'</td></tr>';
  }).join('');
  var t=A.us,diff=A.us.pts-A.opp.pts;
  return '<div class="tw"><table class="t"><thead><tr><th>Jugador</th><th>Min</th><th>Pts</th><th>T2</th><th>T3</th><th>TL</th>'+advTh(adv)+'<th>Reb</th><th>Ast</th><th>Rob</th><th>Per</th><th>Tap</th><th>Fal</th><th>F.Rec</th><th>+/-</th></tr></thead><tbody>'+rows
    +'</tbody><tfoot><tr><td>Equipo</td><td></td><td>'+t.pts+'</td><td>'+ma(t.s2m,t.s2a)+'</td><td>'+ma(t.s3m,t.s3a)+'</td><td>'+ma(t.ftm,t.fta)+'</td>'+shootCells(t,adv)+'<td>'+(t.oreb+t.dreb)+'</td><td>'+t.ast+'</td><td>'+t.stl+'</td><td>'+t.tov+'</td><td>'+t.blk+'</td><td>'+t.pf+'</td><td>'+t.drew+'</td><td class="'+(diff>0?'pos':diff<0?'neg':'')+'">'+sgn(diff)+'</td></tr></tfoot></table></div>';
}
function oppRows(A){
  return Object.keys(A.op).map(function(k){return {k:k,s:A.op[k]};}).sort(function(a,b){return b.s.pts-a.s.pts||(parseInt(a.k,10)||0)-(parseInt(b.k,10)||0);});
}
function oppBox(A,g,adv){
  var rows=oppRows(A).map(function(r){
    var s=r.s;
    return '<tr><td><b>'+(r.k==='EQ'?'Equipo':'#'+esc(r.k))+'</b></td><td><b>'+s.pts+'</b></td><td>'+ma(s.s2m,s.s2a)+'</td><td>'+ma(s.s3m,s.s3a)+'</td><td>'+ma(s.ftm,s.fta)+'</td>'+shootCells(s,adv)+'<td>'+(s.oreb+s.dreb)+'</td><td>'+s.ast+'</td><td>'+s.stl+'</td><td>'+s.tov+'</td><td>'+s.blk+'</td><td>'+s.pf+'</td><td>'+s.drew+'</td></tr>';
  }).join('');
  if(!rows)return '<p class="empty">Aún no hay acciones del rival.</p>';
  var t=A.opp;
  return '<div class="tw"><table class="t"><thead><tr><th>Dorsal</th><th>Pts</th><th>T2</th><th>T3</th><th>TL</th>'+advTh(adv)+'<th>Reb</th><th>Ast</th><th>Rob</th><th>Per</th><th>Tap</th><th>Fal</th><th>F.Rec</th></tr></thead><tbody>'+rows
    +'</tbody><tfoot><tr><td>Total</td><td>'+t.pts+'</td><td>'+ma(t.s2m,t.s2a)+'</td><td>'+ma(t.s3m,t.s3a)+'</td><td>'+ma(t.ftm,t.fta)+'</td>'+shootCells(t,adv)+'<td>'+(t.oreb+t.dreb)+'</td><td>'+t.ast+'</td><td>'+t.stl+'</td><td>'+t.tov+'</td><td>'+t.blk+'</td><td>'+t.pf+'</td><td>'+t.drew+'</td></tr></tfoot></table></div>';
}
function unitsTable(A){
  var us=Object.keys(A.units).map(function(k){return A.units[k];}).filter(function(u){return u.min>=30;}).sort(function(a,b){return b.min-a.min;}).slice(0,6);
  if(!us.length)return '<p class="empty">Los quintetos aparecen cuando hay minutos jugados.</p>';
  return '<div class="tw"><table class="t"><thead><tr><th>Quinteto</th><th>Min</th><th>A favor</th><th>En contra</th><th>+/-</th></tr></thead><tbody>'+us.map(function(u){
    var nums=u.ids.map(pById).filter(Boolean).sort(byNum).map(function(p){return p.num;}).join('-');
    var df=u.pf-u.pa;
    return '<tr><td><b>'+esc(nums)+'</b></td><td>'+mmss(u.min)+'</td><td>'+u.pf+'</td><td>'+u.pa+'</td><td class="'+(df>0?'pos':df<0?'neg':'')+'">'+sgn(df)+'</td></tr>';
  }).join('')+'</tbody></table></div>';
}
function statsScopeBar(g){
  var pg=playedGames();
  if(!g||pg.length<2)return '';
  return '<div class="rep-bar" style="margin:14px 0 0"><button class="chip'+(U.statsScope!=='season'?' on':'')+'" data-a="statsScope" data-v="game">Este partido</button><button class="chip'+(U.statsScope==='season'?' on':'')+'" data-a="statsScope" data-v="season">Toda la temporada ('+pg.length+')</button></div>';
}
function loadHTML(A,gp){
  var rows=Object.keys(A.pl).map(function(id){var p=pById(id);if(!p)return null;var min=A.pl[id].min,gg=gp[id]||0;return {p:p,min:min,g:gg,per:gg?min/gg:0};}).filter(Boolean).sort(function(a,b){return b.min-a.min;});
  if(!rows.length)return '<p class="empty">Los minutos aparecen cuando haya partidos jugados.</p>';
  var maxMin=Math.max.apply(null,rows.map(function(r){return r.min;}))||1;
  var withG=rows.filter(function(r){return r.g>0;});
  var avgPer=withG.length?withG.reduce(function(s,r){return s+r.per;},0)/withG.length:0;
  var anyWarn=false;
  var body=rows.map(function(r){
    var warn=r.g>=3&&avgPer>0&&r.per>avgPer*1.3;if(warn)anyWarn=true;
    return '<tr'+(warn?' style="background:var(--foul-bg)"':'')+'><td><b>'+esc(r.p.num)+'</b> '+esc(r.p.name)+'</td><td>'+r.g+'</td><td>'+mmss(r.min)+'</td><td'+(warn?' class="neg"':'')+'>'+(r.g?mmss(r.per):'–')+'</td><td><span class="bar"><i style="width:'+Math.round(r.min*100/maxMin)+'%"></i></span></td></tr>';
  }).join('');
  return '<div class="tw"><table class="t"><thead><tr><th>Jugador</th><th>PJ</th><th>Min</th><th>Min/PJ</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>'
   +(anyWarn?'<p class="mut" style="font-size:13px;margin-top:8px">Resaltados: juegan bastantes más minutos por partido que la media del equipo. Vigila su carga si el calendario está apretado.</p>':'');
}

function zoneStats(shots){
  var z={};
  shots.forEach(function(s){if(!s.z)return;var o=z[s.z]||(z[s.z]={a:0,m:0});o.a++;if(s.m)o.m++;});

}
function zoneTable(shots,cls){

  return '<div class="tw"><table class="t"><thead><tr><th>Zona</th><th>Tiros</th><th>Acierto</th><th></th></tr></thead><tbody>'+names.map(function(n){
    var o=z[n],p=o.m/o.a,c=o.a>=3?(p>=0.5?'hot':(p<=0.25?'cold':'')):'';
    return '<tr><td>'+esc(n)+'</td><td>'+ma(o.m,o.a)+'</td><td class="'+c+'">'+Math.round(p*100)+'%</td><td><span class="bar '+(cls||'')+'"><i style="width:'+Math.round(o.a*100/maxA)+'%"></i></span></td></tr>';

function shotBlock(shots,cls){

}
function flowSVG(g,A){
  var pts=A.flow;if(pts.length<3)return '';
  var W=600,H=170,pl=34,pr=8,pt=14,pb=24,T=Math.max(A.total,1);
  var md=Math.max(6,Math.max.apply(null,pts.map(function(p){return Math.abs(p.d);})));
  function X(t){return (pl+(W-pl-pr)*t/T).toFixed(1);}
  function Y(d){return (pt+(H-pt-pb)*(1-(d+md)/(2*md))).toFixed(1);}
  var zero=Y(0),path='M'+X(0)+' '+Y(0),prev=0;
  pts.slice(1).forEach(function(p){path+=' L'+X(p.t)+' '+Y(prev)+' L'+X(p.t)+' '+Y(p.d);prev=p.d;});
  var area=path+' L'+X(pts[pts.length-1].t)+' '+zero+' L'+X(0)+' '+zero+' Z';
  var maxP=Math.max(4,g.period),acc=0,marks='';
  for(var p=1;p<=maxP;p++){
    var a=acc,b=acc+lenOf(g,p);
    if(a<T){
      if(p>1)marks+='<line class="fl-sep" x1="'+X(a)+'" x2="'+X(a)+'" y1="'+pt+'" y2="'+(H-pb)+'"/>';
      if(a<T)marks+='<text x="'+((+X(a)+ +X(Math.min(b,T)))/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+perLabel(p)+'</text>';
    }
    acc=b;
  }
  return '<svg class="flow" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución de la diferencia de marcador">'
   +'<defs><clipPath id="cpT"><rect x="0" y="0" width="'+W+'" height="'+zero+'"/></clipPath><clipPath id="cpB"><rect x="0" y="'+zero+'" width="'+W+'" height="'+(H-zero)+'"/></clipPath></defs>'
   +'<path class="fl-us" d="'+area+'" clip-path="url(#cpT)"/><path class="fl-opp" d="'+area+'" clip-path="url(#cpB)"/>'
   +'<line class="fl-ax" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+zero+'" y2="'+zero+'"/>'+marks
   +'<path class="fl-line" fill="none" d="'+path+'"/>'
   +'<text x="'+(pl-6)+'" y="'+(+Y(md)+10)+'" text-anchor="end">+'+md+'</text><text x="'+(pl-6)+'" y="'+(+Y(-md)+2)+'" text-anchor="end">-'+md+'</text></svg>';
}

function reportGames(g){

function keyPoints(A){
  var k=[],rows=oppRows(A).filter(function(r){return r.k!=='EQ';}),o=A.opp,d=D(o);
  var top=rows.filter(function(r){return r.s.pts>0;}).slice(0,2);
  if(top.length&&o.pts>0){
    var sum=top.reduce(function(a,r){return a+r.s.pts;},0);
    k.push({t:'Anotadores: '+top.map(function(r){return '#'+r.k+' ('+r.s.pts+' pts)';}).join(' y ')+'. Suman el '+Math.round(sum*100/o.pts)+'% de sus puntos.'});
  }
  if(d.fga>=10){
    var fx=factors(A);
    k.push({t:'Acierto efectivo (eFG%): '+fpct(fx.opp.efg)+' frente a '+fpct(fx.us.efg)+' nuestro. TS%: '+fpct(fx.opp.ts)+'.',w:fx.opp.efg>fx.us.efg});
  }
  if(o.s3a>=5){
    var p3=o.s3m/o.s3a;
    k.push({t:'Triples: '+ma(o.s3m,o.s3a)+' ('+pct(o.s3m,o.s3a)+')'+(p3>=0.36?'. Castigan si se les deja tirar.':(p3<=0.28?'. Fallan desde fuera; se puede proteger la pintura.':'.')),w:p3>=0.36});
  }
  if(o.fta>=6&&o.ftm/o.fta<0.65)k.push({t:'Tiros libres: '+ma(o.ftm,o.fta)+' ('+pct(o.ftm,o.fta)+'). Flojos desde la línea; conviene hacerles falta al final.'});
  var fl=rows.filter(function(r){return r.s.pf>=3*A.games;}).sort(function(a,b){return b.s.pf-a.s.pf;}).slice(0,3);
  if(fl.length)k.push({t:'Cargados de faltas: '+fl.map(function(r){return '#'+r.k+' ('+r.s.pf+')';}).join(', ')+'. Atacarles pronto para sacarles del partido.',w:true});
  if(o.tov>0)k.push({t:'Pérdidas del rival: '+o.tov+(A.games>1?' ('+(o.tov/A.games).toFixed(1)+' por partido)':'')+'. Robos: '+o.stl+'.'});
  if(o.oreb/A.games>=10)k.push({t:'Cargan el rebote de ataque ('+o.oreb+' en total).',w:true});
  if(d.poss>0)k.push({t:'Ritmo: unas '+Math.round(d.poss/A.games)+' posesiones por partido y '+d.ppp.toFixed(2)+' puntos por posesión.'});
  var pk=Object.keys(A.play).sort(function(a,b){return A.play[b].n-A.play[a].n;})[0];
  if(pk)k.push({t:'Jugada más usada: '+pk+' ('+A.play[pk].n+' veces, '+(A.play[pk].pts/A.play[pk].n).toFixed(2)+' puntos por jugada).'});
  var dk=Object.keys(A.def).sort(function(a,b){return (A.def[b].fga+A.def[b].tov)-(A.def[a].fga+A.def[a].tov);})[0];
  if(dk){var dd=A.def[dk];k.push({t:'Defensa más usada contra nosotros: '+dk+' ('+(dd.fga+dd.tov)+' de nuestras acciones). Nuestro acierto: '+pct(dd.fgm,dd.fga)+'.'});}
  var z=zoneStats(A.shots.opp),zs=ZONES.filter(function(n){return z[n]&&z[n].a>=3;}).sort(function(a,b){return z[b].m/z[b].a-z[a].m/z[a].a;});
  if(zs.length){
    k.push({t:'Zona más efectiva del rival: '+zs[0].toLowerCase()+' ('+ma(z[zs[0]].m,z[zs[0]].a)+').',w:true});
    if(zs.length>1){var wz=zs[zs.length-1];k.push({t:'Zona más floja: '+wz.toLowerCase()+' ('+ma(z[wz].m,z[wz].a)+').'});}
  }
  return k;
}

function reportBody(g,list){

function shareText(g,list){

  if(rows.length){L.push('','*Jugadores del rival*');rows.forEach(function(r){L.push('#'+r.k+': '+r.s.pts+' pts, T3 '+ma(r.s.s3m,r.s.s3a)+', '+r.s.pf+' faltas');});}
  L.push('','*Comparativa (nosotros / rival)*');

  L.push('Triples: '+ma(A.us.s3m,A.us.s3a)+' / '+ma(A.opp.s3m,A.opp.s3a));
  L.push('Rebotes: '+du.reb+' / '+dO.reb+', pérdidas: '+A.us.tov+' / '+A.opp.tov);
  if(S.settings.advReport){
    var fx=factors(A);
    L.push('','*Cuatro factores (nosotros / rival)*');
    L.push('eFG%: '+fpct(fx.us.efg)+' / '+fpct(fx.opp.efg)+'   TS%: '+fpct(fx.us.ts)+' / '+fpct(fx.opp.ts));
    L.push('TOV%: '+fpct(fx.us.tov)+' / '+fpct(fx.opp.tov)+'   ORB%: '+fpct(fx.us.orb)+' / '+fpct(fx.opp.orb));
    L.push('DRB%: '+fpct(fx.us.drb)+' / '+fpct(fx.opp.drb)+'   FT/FGA: '+fpct(fx.us.ftr)+' / '+fpct(fx.opp.ftr));
    L.push('Asistencias/pérdida: '+fmtRatio(astTo(A.us))+' / '+fmtRatio(astTo(A.opp)));
    L.push('Valoración ofensiva (pts/100 pos.): '+fx.us.rtg.toFixed(1)+' / '+fx.opp.rtg.toFixed(1));
    L.push('Net Rating: '+sgnf(fx.us.net)+' / '+sgnf(fx.opp.net));
    var C=clutchTotals(list),csample=D(C.us).fga+C.us.fta+D(C.opp).fga+C.opp.fta;
    if(csample)L.push('','*Últimos 5 min, diferencia ≤5*',C.us.pts+' - '+C.opp.pts+' (eFG% '+fpct(D(C.us).efg)+' / '+fpct(D(C.opp).efg)+', pérdidas '+C.us.tov+' / '+C.opp.tov+')');
  }
  var t=S.ai[aiKey(g,list)];
  if(t)L.push('','*Resumen*',t);
  return L.join('\n');
}
function aiData(A,g,list){
  function tot(s){var d=D(s);return {puntos:s.pts,t2:ma(s.s2m,s.s2a),t3:ma(s.s3m,s.s3a),tl:ma(s.ftm,s.fta),rebotes_ataque:s.oreb,rebotes_defensa:s.dreb,asistencias:s.ast,robos:s.stl,perdidas:s.tov,faltas:s.pf,asistencias_por_perdida:s.tov?+((s.ast/s.tov).toFixed(2)):null,posesiones_estimadas:Math.round(d.poss),puntos_por_posesion:+d.ppp.toFixed(2),puntos_por_tiro:+pps(s).toFixed(2)};}
  var z=zoneStats(A.shots.opp),fx=factors(A);
  function fac(f){return {eFG:+(f.efg*100).toFixed(1),TS:+(f.ts*100).toFixed(1),TOV:+(f.tov*100).toFixed(1),ORB:+(f.orb*100).toFixed(1),DRB:+(f.drb*100).toFixed(1),FT_FGA:+(f.ftr*100).toFixed(1),valoracion_ofensiva_por_100_posesiones:+f.rtg.toFixed(1),net_rating:+f.net.toFixed(1)};}
  var C=clutchTotals(list),cu=D(C.us),co=D(C.opp),csample=cu.fga+C.us.fta+co.fga+C.opp.fta;
  return {partidos:list.length,rival:g.opp,rival_totales:tot(A.opp),nuestros_totales:tot(A.us),cuatro_factores_rival:fac(fx.opp),cuatro_factores_nuestros:fac(fx.us),
    momentos_de_presion:!csample?null:{descripcion:'últimos 5 min del periodo decisivo, diferencia de 5 puntos o menos',muestra_pequena:csample<8,puntos_nuestros:C.us.pts,puntos_rival:C.opp.pts,perdidas_nuestras:C.us.tov,perdidas_rival:C.opp.tov},
    jugadores_rival:oppRows(A).filter(function(r){return r.k!=='EQ';}).slice(0,8).map(function(r){return {dorsal:r.k,pts:r.s.pts,t2:ma(r.s.s2m,r.s.s2a),t3:ma(r.s.s3m,r.s.s3a),tl:ma(r.s.ftm,r.s.fta),rebotes:r.s.oreb+r.s.dreb,asistencias:r.s.ast,perdidas:r.s.tov,faltas:r.s.pf};}),
    zonas_tiro_rival:ZONES.filter(function(n){return z[n];}).map(function(n){return {zona:n,anotados:z[n].m,intentos:z[n].a};}),
    jugadas_rival:Object.keys(A.play).map(function(k){return {jugada:k,veces:A.play[k].n,puntos:A.play[k].pts};}),
    defensas_rival_contra_nosotros:Object.keys(A.def).map(function(k){var d=A.def[k];return {defensa:k,tiros_nuestros:d.fga,aciertos:d.fgm,perdidas_nuestras:d.tov};})};
}

   +'Usa solo estos datos y no inventes nada. Si la muestra es pequeña (pocos partidos o pocos tiros), dilo en una frase. Formato: texto plano, párrafos cortos o líneas que empiecen por "- ", sin títulos ni asteriscos.\n\nDatos (JSON):\n'+JSON.stringify(aiData(A,g,list));

function stopClock(){
  var g=cur();clearInterval(TICK);TICK=null;
  if(g&&g.running){var el=(performance.now()-U.clk.t0)/1000;g.clock=Math.max(0,U.clk.c0-el);g.running=false;save();}
}
function startClock(){
  var g=cur();if(!g||g.clock<=0)return;
  g.running=true;U.clk={t0:performance.now(),c0:g.clock};
  clearInterval(TICK);TICK=setInterval(tick,200);
}
function tick(){
  var g=cur();if(!g||!g.running){clearInterval(TICK);TICK=null;return;}
  var el=(performance.now()-U.clk.t0)/1000;g.clock=Math.max(0,U.clk.c0-el);
  var n=document.getElementById('clk');if(n)n.textContent=mmss(g.clock);
  if(g.clock<=0){
    g.running=false;clearInterval(TICK);TICK=null;save();
    try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
    render();
  }else if(Math.round(g.clock*5)%25===0)save();
}
function setToast(msg){
  U.toast=msg;clearTimeout(U.toastT);
  U.toastT=setTimeout(function(){U.toast=null;var t=document.getElementById('toast');if(t)t.remove();},2200);
}
function commit(base,pos){
  var g=cur();if(!g)return;
  var o=Object.assign({},base,pos||{});
  if(o.side==='us'&&(o.t==='s2'||o.t==='s3'||o.t==='tov'))o.def=g.oppDefense;
  if(o.side==='opp'&&(o.t==='s2'||o.t==='s3'||o.t==='tov'))o.def=g.ourDefense||'Individual';
  if(o.side==='opp'&&U.play&&(o.t==='s2'||o.t==='s3'||o.t==='tov')){o.play=U.play;U.play=null;}
  if(o.side==='us'&&U.oplay&&(o.t==='s2'||o.t==='s3'||o.t==='tov')){o.play=U.oplay;U.oplay=null;}
  if(o.side==='us')U.play=null;
  if(o.side==='opp')U.oplay=null;
  var e=addEvent(g,o);
  U.sel=null;U.assist=null;U.foulRec=null;
  if(o.side==='us'&&e.m&&(o.t==='s2'||o.t==='s3'))U.assist={ev:e.id,scorer:e.k};
  if(o.t==='to')stopClock();
  if(o.t==='pf'){
    U.foulRec={ev:e.id,side:o.side==='us'?'opp':'us'};
    if(o.side==='us'){
      var p=pById(o.k),n=g.events.filter(function(x){return !x.v&&x.t==='pf'&&x.k===o.k&&x.side==='us';}).length;
      if(p&&n===4)setToast('#'+p.num+' lleva 4 faltas');
      if(p&&n>=5)setToast('#'+p.num+' llega a 5 faltas: eliminado');
    }
    var tf=foulsTeam(g,o.side,g.period);
    if(tf===5)setToast('Faltas de equipo: bonus para '+(o.side==='us'?g.opp:S.team.name));
  }
  save();render();
}
function mapTap(ev,svg){
  var r=svg.getBoundingClientRect();
  if(!r.width||!r.height)return;
  var sc=Math.min(r.width/600,r.height/560),ox=(r.width-600*sc)/2,oy=(r.height-560*sc)/2;
  var x=(ev.clientX-r.left-ox)/sc,y=(ev.clientY-r.top-oy)/sc;
  x=Math.max(0,Math.min(600,x));y=Math.max(0,Math.min(560,y));
  var base=U.sheet.base;U.sheet=null;
  commit(base,{x:Math.round(x),y:Math.round(y),z:zoneOf(x,y)});
}
function copyText(text){
  var ok=false;
  try{
    var ta=document.getElementById('txtArea');
    if(ta){ta.focus();ta.select();ok=document.execCommand('copy');}
  }catch(e){}
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Copiado');},function(){toast('Selecciona el texto y cópialo a mano');});
    return;
  }
  toast(ok?'Copiado':'Selecciona el texto y cópialo a mano');
}
function saveFile(name,data,okMsg){
  if(DL){
    DL.save({filename:name,data:data}).then(function(){toast(okMsg);}).catch(function(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo');});
    return;
  }
  if(STANDALONE){
    try{
      var blob=new Blob([data],{type:/\.json$/.test(name)?'application/json':'text/html'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
      toast(okMsg);
    }catch(e){toast('No se pudo guardar el archivo');}
    return;
  }
  toast('Descarga no disponible aquí');
}

/* identificadores deterministas: el mismo dato siempre acaba en el mismo registro */
function cyrb53(str,seed){
  var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
  for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function rid(s){return (cyrb53(s,1).toString(36)+cyrb53(s,2).toString(36)+'000000000000000').slice(0,15);}
function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}return h.toString(36)+':'+s.length;}
function evU(e){return e.u||e.ts||1;}
function evO(e){return e.o||(e.ts||0)*1000;}

  if(!DBX)return {k:off?'off':'local',t:off?'Sin conexión, guardado en el dispositivo':'Sin sesión: solo en este dispositivo'};

}
